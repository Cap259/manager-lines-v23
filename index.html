<script>
/* ===== V2.5: profitability engine, line bills, reservation cycles, branding ===== */
(function(){
'use strict';
const V25='2.5';
let _activatingReservationIdV25='';

function localISOv25(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function addDaysV25(s,n){const d=parseDate(s);if(!d)return s;d.setDate(d.getDate()+Number(n||0));return localISOv25(d)}
function cycleDueForGroupV25(group,at=todayISO()){
  const base=parseDate(String(at).slice(0,10))||new Date(), day=groupDay(group);
  let y=base.getFullYear(),m=base.getMonth();
  if(base.getDate()<day)m--;
  const last=new Date(y,m+1,0).getDate();
  return localISOv25(new Date(y,m,Math.min(day,last)));
}
function targetGroupForV25(network,when=new Date()){
  let d;
  if(when instanceof Date)d=when;
  else if(String(when||'').includes('T'))d=new Date(when);
  else d=parseDate(String(when||''))||new Date();
  const day=d.getDate();
  if(network==='اتصالات')return day<=15?'اتصالات يوم 15':'اتصالات يوم 1';
  return day<=15?'WE يوم 16':'WE يوم 1';
}
function targetLabelV25(r){return r?.targetGroup||targetGroupForV25(r?.network||'اتصالات',r?.createdAt||todayISO())}
function reservationActiveV25(r){return r&&r.active!==false&&r.status!=='تم التفعيل'&&r.status!=='ملغي'}
function currentExtraSalesV25(l){const cyc=cycleDueForGroupV25(l.group);return (state.extraGbSales||[]).filter(x=>x.active!==false&&x.lineId===l.id&&x.cycleDue===cyc)}
function paidLineBillCountV25(l){return Number(l.legacyPaidBillCount||0)+(state.lineBills||[]).filter(b=>b.lineId===l.id&&b.status==='مدفوع').length}

function ensureLineBillsV25(initial=false){
  state.lineBills=state.lineBills||[];
  let changed=false;
  for(const l of state.lines||[]){
    if(!l.active)continue;
    const current=cycleDueForGroupV25(l.group);
    let bills=state.lineBills.filter(b=>b.lineId===l.id).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
    if(!bills.length){
      state.lineBills.push({id:uid('lb'),lineId:l.id,dueDate:current,amount:Number(l.cost||0),paid:0,status:initial?'غير محدد':'غير مدفوع',paidDate:'',createdAt:new Date().toISOString(),migrationUnknown:!!initial});
      changed=true;bills=state.lineBills.filter(b=>b.lineId===l.id).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
    }
    let last=bills[bills.length-1];
    let next=addMonths(last.dueDate,1);
    while(next<=current){
      state.lineBills.push({id:uid('lb'),lineId:l.id,dueDate:next,amount:Number(l.cost||0),paid:0,status:'غير مدفوع',paidDate:'',createdAt:new Date().toISOString(),migrationUnknown:false});
      changed=true;last={dueDate:next};next=addMonths(next,1);
    }

}
function currentLineBillV25(l){
  ensureLineBillsV25(false);
  return (state.lineBills||[]).filter(b=>b.lineId===l.id&&b.dueDate<=todayISO()).sort((a,b)=>b.dueDate.localeCompare(a.dueDate))[0]||null;
}
function lineBillInfoV25(l){

  if(!b)return{amount:Number(l.cost||0),paid:0,remaining:Number(l.cost||0),status:'غير محدد',due:'',reminder:'',overdueDays:0,b:null};

  let status=b.status||statusOf(amount,paid);
  if(status!=='غير محدد')status=statusOf(amount,paid)==='لسه'?'غير مدفوع':statusOf(amount,paid);
  const reminder=addDaysV25(b.dueDate,Number(state.settings.lineBillReminderDays||5));
  const overdueDays=(remaining>0&&status!=='غير محدد'&&todayISO()>reminder)?Math.max(0,diffDays(todayISO(),reminder)):0;
  return{amount,paid,remaining,status,due:b.dueDate,reminder,overdueDays,b};
}
function lineBillGroupSummaryV25(group){
  const lines=state.lines.filter(l=>l.active&&l.group===group),infos=lines.map(l=>({l,i:lineBillInfoV25(l)}));
  return{

    unpaidCount:infos.filter(x=>x.i.status!=='مدفوع'&&x.i.status!=='غير محدد').length,

<script id="familyLinesV26Patch">
/* FAMILY_LINES_PATCH_V26 — flexible pricing + minutes + wireless split + smart placement + navigation */
(function(){
'use strict';
const V26='2.6';
let _wirelessTabV26='iHome';
let _pageHistoryV26=[];
let _goingBackV26=false;
let _wirelessReturnPageV26='wireless';

const defaultLineMinutesV26=net=>net==='اتصالات'?12000:10000;
const defaultMemberMinutesV26=gb=>Number(gb||0)>=40?2000:1500;
const activeWirelessV26=()=> (state.wireless||[]).filter(w=>w.active!==false);
const activeReservationsV26=()=> (state.reservations||[]).filter(r=>r.active!==false&&r.status!=='تم التفعيل'&&r.status!=='ملغي');
function cloneV26(o){return JSON.parse(JSON.stringify(o||{}))}
function wireLabelV26(type){return type==='iHome'?'iHome اتصالات':'WE Air'}
function safeTextV26(v){return String(v??'')}
function currentMobileMapV26(net,type='customer'){
  state.settings.customerPrices=state.settings.customerPrices||{WE:{},'اتصالات':{}};
  state.settings.dealerPrices=state.settings.dealerPrices||{WE:{},'اتصالات':{}};
  state.settings.customerPrices[net]=state.settings.customerPrices[net]||{};
  state.settings.dealerPrices[net]=state.settings.dealerPrices[net]||{};
  return type==='dealer'?state.settings.dealerPrices[net]:state.settings.customerPrices[net];
}
function mobilePriceExistsV26(net,gb,type='customer'){
  const m=currentMobileMapV26(net,type),k=String(Number(gb||0));
  return Object.prototype.hasOwnProperty.call(m,k)&&Number.isFinite(Number(m[k]));
}
function setMobilePriceV26(net,gb,type,price){
  gb=Number(gb||0);price=Number(price||0);if(!(gb>0)||price<0)return;
  currentMobileMapV26(net,type)[String(gb)]=price;
  if(type==='customer'){
    if(net==='WE')state.settings.wePrices=cloneV26(state.settings.customerPrices.WE);
    else state.settings.etisalatPrices=cloneV26(state.settings.customerPrices['اتصالات']);
  }
  syncCatalogMobileV26(net,gb);
}
function syncCatalogMobileV26(net,gb){
  state.settings.priceCatalogV26=state.settings.priceCatalogV26||[];
  gb=Number(gb||0);if(!(gb>0))return;
  let x=state.settings.priceCatalogV26.find(x=>x.category==='موبايل'&&x.network===net&&Number(x.gb)===gb);
  if(!x){x={id:uid('pc'),category:'موبايل',network:net,name:`${gb}GB`,gb};state.settings.priceCatalogV26.push(x)}
  x.customerPrice=Number(currentMobileMapV26(net,'customer')[String(gb)]||0);
  x.dealerPrice=Number(currentMobileMapV26(net,'dealer')[String(gb)]??x.customerPrice??0);
}
function syncCatalogV26(){
  state.settings.priceCatalogV26=state.settings.priceCatalogV26||[];
  for(const net of ['WE','اتصالات']){
    const keys=new Set([...Object.keys(currentMobileMapV26(net,'customer')),...Object.keys(currentMobileMapV26(net,'dealer'))]);
    keys.forEach(k=>syncCatalogMobileV26(net,Number(k)));
  }
  const wmap=state.settings.wirelessPrices||{};
  Object.entries(wmap).forEach(([name,price])=>{
    const type=name.startsWith('iHome')?'iHome':name.startsWith('WE Air')?'WE Air':'';if(!type)return;
    const gb=Number(name.match(/\d+/)?.[0]||0);
    let x=state.settings.priceCatalogV26.find(x=>x.category===type&&Number(x.gb)===gb);
    if(!x){x={id:uid('pc'),category:type,network:type==='iHome'?'اتصالات':'WE',name,gb};state.settings.priceCatalogV26.push(x)}
    x.customerPrice=Number(price||0);x.dealerPrice=Number(x.dealerPrice??price??0);
  });
}
function ensureV26Data(){
  state.settings=state.settings||{};
  state.settings.priceCatalogV26=state.settings.priceCatalogV26||[];
  state.settings.wirelessPrices=state.settings.wirelessPrices||{'WE Air 90':350,'WE Air 325':750,'iHome 140':450,'iHome 225':550};
  for(const l of state.lines||[]){if(l.minutesTotal==null)l.minutesTotal=defaultLineMinutesV26(l.network)}

  state.settings.appVersion=V26;state.settings.routerRentalEnabled=false;
  state.schemaVersion=Math.max(Number(state.schemaVersion||1),7);

}

/* ===== pricing ===== */

  gb=Number(gb||0);currentPrice=Number(currentPrice||0);
  if(!(gb>0)||mobilePriceExistsV26(net,gb,type))return{ok:true,price:currentPrice};
  const label=type==='dealer'?'سعر التاجر':'سعر العميل';
  if(confirm(`⚠️ باقة ${gb}GB على ${net} غير مسجلة في جدول الأسعار (${label}).\n\nهل تريد إضافتها بالسعر الحالي ${money(currentPrice)}؟`)){
    setMobilePriceV26(net,gb,type,currentPrice);storageSet(STORAGE_KEY,JSON.stringify(state));
    return{ok:true,price:currentPrice,added:true};

  if(confirm('هل تريد استخدام هذا السعر لهذه العملية فقط بدون إضافته لجدول الأسعار؟'))return{ok:true,price:currentPrice,once:true};

}

function lineCandidateV26(l,gb,price){const m=lineMetrics(l),f=lineFinancials(l);if(m.vacancies<=0||m.remaining<gb)return null;const currentSales=Number(f.totalDue||0),cost=Number(l.cost||0),afterSales=currentSales+Number(price||0),currentGap=Math.max(0,cost-currentSales),afterGap=Math.max(0,cost-afterSales),afterProfit=afterSales-cost,remainingAfter=m.remaining-gb,vacAfter=m.vacancies-1,coverageGain=currentGap-afterGap;let score=0;score+=coverageGain*1000;if(afterGap===0&&currentGap>0)score+=250000;score+=Math.min(currentGap,Number(price||0))*300;score-=Math.max(0,remainingAfter)*3;score-=Math.max(0,remainingAfter)*Math.max(0,1-vacAfter)*2;if(vacAfter===0&&remainingAfter>20)score-=6000;return{l,m,f,currentSales,cost,afterSales,currentGap,afterGap,afterProfit,remainingAfter,vacAfter,coverageGain,score}}

function reservationItemsV26(network,group){return activeReservationsV26().filter(r=>r.network===network&&(r.targetGroup||targetGroupForV25(r.network,r.createdAt||new Date()))===group).map(r=>({id:r.id,name:r.name||r.phone,phone:r.phone,gb:Number(r.package||0),amount:Number(r.amount||0),minutes:Number(r.minutes||defaultMemberMinutesV26(r.package)),r})).filter(x=>x.gb>0).sort((a,b)=>b.gb-a.gb||b.amount-a.amount)}
function existingLineStatesV26(network,group){return state.lines.filter(l=>l.active&&l.network===network&&l.group===group).map(l=>{const m=lineMetrics(l),f=lineFinancials(l);return{line:l,remainingGb:Math.max(0,Number(m.remaining||0)),slots:Math.max(0,Number(m.vacancies||0)),baseSales:Number(f.totalDue||0),cost:Number(l.cost||0),assigned:[]}}).filter(x=>x.remainingGb>0&&x.slots>0)}
function assignmentScoreV26(lines){let score=0,placed=0,gb=0;for(const ln of lines){const add=ln.assigned.reduce((s,x)=>s+x.amount,0),ag=ln.assigned.reduce((s,x)=>s+x.gb,0);placed+=ln.assigned.length;gb+=ag;const beforeGap=Math.max(0,ln.cost-ln.baseSales),afterGap=Math.max(0,ln.cost-(ln.baseSales+add));score+=(beforeGap-afterGap)*1200;if(beforeGap>0&&afterGap===0)score+=200000;score-=ln.remainingGb*2;if(ln.slots===0&&ln.remainingGb>20)score-=4000}return score+placed*1000000+gb*30}

  scheduleDecorateV27();return r;

/* ===== sort base lines by owner so each person's lines stay together ===== */
function ownerOrderMapV27(){const map=new Map();let n=0;for(const l of state.lines||[]){const k=normOwnerV27(l.owner);if(!map.has(k))map.set(k,n++)}return map}
function sortLineCardsV27(container,selector){if(!container)return;const order=ownerOrderMapV27(),cards=[...container.querySelectorAll(selector)];cards.sort((a,b)=>{const ida=(String(a.getAttribute('onclick')||'').match(/showLine\('([^']+)'\)/)||[])[1],idb=(String(b.getAttribute('onclick')||'').match(/showLine\('([^']+)'\)/)||[])[1],la=state.lines.find(x=>x.id===ida),lb=state.lines.find(x=>x.id===idb);if(!la||!lb)return 0;const oa=order.get(normOwnerV27(la.owner))??9999,ob=order.get(normOwnerV27(lb.owner))??9999;return oa-ob||String(la.number).localeCompare(String(lb.number))});cards.forEach(c=>container.appendChild(c))}

attentionItems=function(){const arr=_attentionItemsV27Base.apply(this,arguments).filter(x=>x.id!=='nearLines'),rows=(state.lines||[]).filter(l=>l.active).map(l=>({l,m:lineMetrics(l)})).filter(x=>x.m.vacancies>0&&x.m.remaining>0),vac=rows.reduce((s,x)=>s+x.m.vacancies,0),gb=rows.reduce((s,x)=>s+x.m.remaining,0);if(rows.length)arr.splice(Math.min(1,arr.length),0,{id:'availableLinesV27',txt:'خطوط متاحة لإضافة أرقام',val:`${num(rows.length)} خط • ${num(vac)} مكان • ${num(gb)}GB`,cls:'good'});return arr};
function openAvailableLinesV27(){const rows=(state.lines||[]).filter(l=>l.active).map(l=>({l,m:lineMetrics(l),f:lineFinancials(l)})).filter(x=>x.m.vacancies>0&&x.m.remaining>0),order=ownerOrderMapV27();rows.sort((a,b)=>(order.get(normOwnerV27(a.l.owner))??9999)-(order.get(normOwnerV27(b.l.owner))??9999)||String(a.l.number).localeCompare(String(b.l.number)));modal('✅ الخطوط المتاحة لإضافة أرقام',`<div class="alert good">عدد الخطوط ${num(rows.length)} • الأماكن الفارغة ${num(rows.reduce((s,x)=>s+x.m.vacancies,0))} • الجيجات المتاحة ${num(rows.reduce((s,x)=>s+x.m.remaining,0))}GB</div><div class="cards-list">${rows.map(x=>`<article class="best-fit-card-v26 clickable-card" onclick="showLine('${x.l.id}')"><div class="best-fit-head-v26"><div><div class="type">${esc(x.l.group)}</div><h4>${esc(x.l.owner)} • ${esc(x.l.number)}</h4><p>مبيعات ${money(x.f.totalDue)} • ${profitText(x.f.netProfit)}</p></div><div class="v26-dual-heroes"><div class="gb-hero-v26"><small>متبقي</small><strong>${num(x.m.remaining)}</strong><em>GB</em></div><div class="vacancy-hero-v26 ${x.m.vacancies>=2?'good':'warn'}"><small>الأماكن الفارغة</small><strong>${num(x.m.vacancies)}</strong><em>مكان</em></div></div></div></article>`).join('')||'<div class="empty">لا توجد خطوط متاحة حاليًا</div>'}</div>`);scheduleDecorateV27()}

/* ===== show full base-line numbers and a copy icon next to every visible Egyptian mobile/SIM number ===== */
let _decorateScheduledV27=false;
function uniqueLineByLast4V27(last4){const a=(state.lines||[]).filter(l=>String(l.number||'').slice(-4)===last4);return a.length===1?a[0]:null}
function enhanceTextNodeV27(node){
  const p=node.parentElement;if(!p||p.closest('script,style,input,textarea,select,option,button,.phone-with-copy-v27,.no-phone-decorate-v27'))return;let text=node.nodeValue;if(!text||(!/\*{4}\d{4}/.test(text)&&!/01\d{9}/.test(text)))return;
  text=text.replace(/\*{4}(\d{4})/g,(m,last)=>uniqueLineByLast4V27(last)?.number||m);if(!/01\d{9}/.test(text)){node.nodeValue=text;return}
  const frag=document.createDocumentFragment();let pos=0;for(const m of text.matchAll(/01\d{9}/g)){if(m.index>pos)frag.appendChild(document.createTextNode(text.slice(pos,m.index)));const span=document.createElement('span');span.className='phone-with-copy-v27';span.appendChild(document.createTextNode(m[0]+' '));const b=document.createElement('button');b.type='button';b.className='copy-phone-v27';b.textContent='📋';b.title='نسخ الرقم';b.onclick=e=>{e.preventDefault();e.stopPropagation();copyPhone(m[0])};span.appendChild(b);frag.appendChild(span);pos=m.index+m[0].length}if(pos<text.length)frag.appendChild(document.createTextNode(text.slice(pos)));node.replaceWith(frag);
}
function decorateNumbersV27(root=document){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(enhanceTextNodeV27)}
function scheduleDecorateV27(){if(_decorateScheduledV27)return;_decorateScheduledV27=true;setTimeout(()=>{_decorateScheduledV27=false;decorateNumbersV27(document)},0)}
const _observerV27=new MutationObserver(()=>scheduleDecorateV27());_observerV27.observe(document.body,{childList:true,subtree:true,characterData:true});
