<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>مدير الخطوط الجديد V2.7</title>

<style>
:root{
  --bg:#0c0716;--panel:#161024;--panel2:#211534;--muted:#a89bb8;--text:#f7f3ff;--accent:#8b5cf6;--accent2:#c084fc;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;--line:#342445;--shadow:0 12px 30px rgba(0,0,0,.28)
}
*{box-sizing:border-box}html{direction:rtl}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at top right,#201037 0,#0c0716 40%);color:var(--text);min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.app{max-width:1200px;margin:auto;padding-bottom:86px}.topbar{position:sticky;top:0;z-index:30;background:rgba(12,7,22,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;box-shadow:var(--shadow)}.brand h1{font-size:17px;margin:0}.brand small{display:block;color:var(--muted);margin-top:2px}.top-actions{margin-right:auto;display:flex;gap:8px}.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:9px 11px}.page{display:none;padding:16px}.page.active{display:block}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}.section-title h2{font-size:20px;margin:0}.section-title p{margin:4px 0 0;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:25px;font-weight:800;margin-top:7px}.stat .sub{font-size:11px;color:var(--muted);margin-top:6px}.group-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.group-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}.group-card h3{margin:0 0 10px;font-size:16px}.group-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini{background:#100a1b;border-radius:12px;padding:9px}.mini span{font-size:11px;color:var(--muted);display:block}.mini b{display:block;margin-top:5px;font-size:16px}.attention{margin-top:14px;background:linear-gradient(135deg,#241133,#160d22);border:1px solid #5a3470;border-radius:18px;padding:14px}.attention h3{margin:0 0 10px}.attention-list{display:grid;gap:8px}.attention-item{display:flex;justify-content:space-between;gap:10px;background:#100a1b;border-radius:12px;padding:10px 12px}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-size:11px;border:1px solid var(--line);background:#130c1f}.pill.good{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.35)}.pill.warn{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.35)}.pill.bad{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.35)}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:12px}.searchbox{flex:1;min-width:210px;position:relative}.searchbox input{width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:none}.btn{border:none;border-radius:13px;padding:11px 14px;background:linear-gradient(135deg,var(--accent),#6d28d9);color:white;font-weight:700}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}.btn.good{background:#166534}.btn.warn{background:#92400e}.btn.bad{background:#991b1b}.btn.small{padding:7px 9px;border-radius:10px;font-size:12px}.filter{padding:11px 12px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.cards-list{display:grid;gap:10px}.row-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:12px;align-items:center}.row-main b{font-size:15px}.row-main small{display:block;color:var(--muted);margin-top:4px}.metric{text-align:center}.metric span{font-size:11px;color:var(--muted);display:block}.metric b{display:block;margin-top:4px}.actions{display:flex;gap:6px;flex-wrap:wrap}.progress{height:8px;background:#0f0919;border-radius:999px;overflow:hidden;margin-top:8px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}.progress.danger>i{background:linear-gradient(90deg,#f59e0b,#ef4444)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}th{position:sticky;top:0;background:#1e1430;color:#d8c9e8}tr:hover td{background:#1a1029}
.bottom-nav{position:fixed;z-index:40;bottom:0;left:0;right:0;background:rgba(15,9,25,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center}.bottom-nav .inner{width:min(900px,100%);display:grid;grid-template-columns:repeat(6,1fr)}.nav-btn{border:none;background:transparent;color:var(--muted);padding:10px 4px 11px;font-size:11px}.nav-btn b{display:block;font-size:18px;margin-bottom:3px}.nav-btn.active{color:white}.nav-btn.active b{color:var(--accent2)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:80;display:grid;place-items:end center;padding:12px}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:#130c1f;border:1px solid var(--line);border-radius:22px 22px 14px 14px;box-shadow:var(--shadow)}.modal-head{position:sticky;top:0;background:#130c1f;border-bottom:1px solid var(--line);padding:15px;display:flex;justify-content:space-between;align-items:center;z-index:2}.modal-head h3{margin:0}.modal-body{padding:15px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#d7cbe1}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#0f0919;color:var(--text);outline:none}.field textarea{min-height:80px;resize:vertical}.hint{font-size:11px;color:var(--muted)}.modal-foot{padding:12px 15px 15px;display:flex;gap:8px;justify-content:flex-start}.alert{padding:11px 12px;border-radius:12px;margin:8px 0;font-size:12px}.alert.bad{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#fecaca}.alert.warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);color:#fde68a}.alert.good{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);color:#bbf7d0}
.search-results{display:grid;gap:10px}.result-card{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:12px}.result-card .type{font-size:11px;color:var(--accent2)}.result-card h4{margin:5px 0}.result-card p{margin:4px 0;color:var(--muted);font-size:12px}.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.setting-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.setting-card h3{margin:0 0 8px}.price-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.price-grid .field input{text-align:center}.empty{text-align:center;padding:30px;color:var(--muted)}
.toast{position:fixed;z-index:120;bottom:88px;left:50%;transform:translateX(-50%);background:#241533;color:white;border:1px solid #62407d;padding:10px 14px;border-radius:999px;box-shadow:var(--shadow);font-size:13px;max-width:90vw}
.lock{position:fixed;inset:0;background:linear-gradient(160deg,#0d0717,#211033);z-index:200;display:grid;place-items:center;padding:20px}.lock-box{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;text-align:center}.lock-box input{width:100%;padding:13px;border-radius:13px;border:1px solid var(--line);background:#0e0818;color:white;text-align:center;font-size:20px;letter-spacing:4px;margin:12px 0}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.group-grid{grid-template-columns:1fr}.row-card{grid-template-columns:1fr 1fr}.row-card .actions{grid-column:1/-1}.settings-grid{grid-template-columns:1fr}.price-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.topbar{padding:10px 12px}.brand small{display:none}.page{padding:12px}.stat .value{font-size:21px}.group-metrics{grid-template-columns:repeat(2,1fr)}.row-card{grid-template-columns:1fr}.metric{text-align:right;display:flex;justify-content:space-between}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.bottom-nav .inner{grid-template-columns:repeat(6,1fr)}.nav-btn{font-size:9px}.nav-btn b{font-size:16px}.price-grid{grid-template-columns:repeat(2,1fr)}}


/* صفحة العميل الكاملة */
.name-link{appearance:none;border:0;background:transparent;color:var(--text);font-weight:800;font-size:15px;padding:0;text-align:right;text-decoration:none;cursor:pointer}.name-link:hover,.name-link:active{color:var(--accent2);text-decoration:underline}.clickable-card{cursor:pointer;transition:.15s transform,.15s border-color}.clickable-card:active{transform:scale(.985);border-color:var(--accent)}.open-hint{display:block;margin-top:8px;color:var(--accent2);font-size:11px}.detail-top{display:flex;align-items:center;gap:12px;margin:2px 0 12px}.detail-top h2{margin:0;font-size:22px}.detail-top p{margin:4px 0 0;color:var(--muted);font-size:12px}.detail-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}.info-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}.info-card h3{margin:0 0 12px;font-size:16px}.info-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}.info-row:last-of-type{border-bottom:0}.info-row span{color:var(--muted);font-size:12px}.info-row b{text-align:left;font-size:13px;max-width:65%;word-break:break-word}.ltr{direction:ltr;unicode-bidi:embed}.important-notes{border-color:#6c467e;background:linear-gradient(145deg,#211330,#160e22)}.card-title-row{display:flex;justify-content:space-between;align-items:center;gap:10px}.notes-box{width:100%;min-height:100px;border:1px solid var(--line);border-radius:13px;background:#0f0919;color:var(--text);padding:12px;resize:vertical;margin-bottom:9px}.payment-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.payment-summary>div{background:#100a1b;border-radius:12px;padding:11px}.payment-summary span{display:block;color:var(--muted);font-size:11px}.payment-summary b{display:block;margin-top:6px;font-size:17px}.detail-date{font-size:17px!important}.block-btn{width:100%;margin-top:12px}.compact-table table{min-width:560px}
@media(max-width:700px){.detail-grid{grid-template-columns:1fr}.detail-actions .btn{flex:1;min-width:120px}.detail-stats{grid-template-columns:repeat(2,1fr)}.payment-summary{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:430px){.detail-top{align-items:flex-start}.detail-top h2{font-size:19px}.detail-actions{display:grid;grid-template-columns:1fr 1fr}.detail-actions .btn{min-width:0;padding:10px 7px;font-size:12px}.payment-summary{grid-template-columns:1fr}.info-row b{max-width:62%}}

/* V1.2 — واجهة تفاعلية وحسابات مالية */
.interactive,.clickable-row,.group-title-link{cursor:pointer;transition:transform .12s ease,border-color .12s ease,background .12s ease}.interactive:active,.clickable-row:active,.group-title-link:active{transform:scale(.985)}.interactive:hover,.clickable-row:hover{border-color:#654387}.group-title-link{display:inline-block;color:var(--text)}
.finance-label{margin:13px 2px 8px;color:#d8c9e8;font-size:12px;font-weight:700;border-top:1px solid rgba(255,255,255,.06);padding-top:10px}.group-metrics.finance .mini{background:#130c20}.group-metrics.finance .mini b{font-size:14px}.btn.renew{background:linear-gradient(135deg,#0f766e,#0d9488)}.inline-actions,.table-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.clickable-row{border-color:var(--line)}.group-finance-summary,.line-finance{grid-template-columns:repeat(3,1fr);margin-bottom:12px}.line-summary{margin-bottom:12px}.customer-on-line p{line-height:1.8}.modal .stats .stat .value.detail-date{font-size:15px}.result-card.clickable-card{position:relative}.result-card.clickable-card:after{content:'›';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--accent2);font-size:20px}.result-card.clickable-card{padding-left:34px}
@media(max-width:700px){.group-finance-summary,.line-finance{grid-template-columns:repeat(2,1fr)}.group-metrics.finance{grid-template-columns:repeat(2,1fr)}}
@media(max-width:430px){.group-finance-summary,.line-finance{grid-template-columns:repeat(2,1fr)}.table-actions{min-width:210px}.group-card{padding:13px}.group-metrics .mini{min-height:68px}}

/* V1.3 — تحصيل موحد وكروت إجراءات تحت كل اسم */
.collection-cards{display:grid;gap:12px}.collection-card{background:linear-gradient(160deg,#1b1129,#130c20);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);cursor:pointer}.collection-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.collection-card-head h3{margin:8px 0 5px;font-size:18px}.collection-card-head p{margin:0;color:var(--muted);font-size:12px;line-height:1.7}.collection-status{font-weight:800;font-size:13px;white-space:nowrap;padding:7px 9px;border-radius:10px;background:#100a1b}.collection-money{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:13px 0}.collection-money>div{background:#0f0919;border-radius:12px;padding:10px}.collection-money span{display:block;color:var(--muted);font-size:11px}.collection-money b{display:block;margin-top:5px;font-size:15px}.collection-actions{display:flex;flex-wrap:wrap;gap:7px;border-top:1px solid rgba(255,255,255,.06);padding-top:11px}.collection-filter-pills{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 12px}.attention-item.interactive{border:1px solid transparent}.attention-item.interactive:hover,.attention-item.interactive:active{border-color:#654387;background:#171024}.setting-card{transition:.12s border-color,.12s transform}.setting-card:active{transform:scale(.99)}
@media(max-width:520px){.collection-money{grid-template-columns:repeat(2,1fr)}.collection-card-head{align-items:flex-start}.collection-status{font-size:11px}.collection-actions .btn{flex:1 1 calc(50% - 7px)}}


/* V1.4 — وضوح الجيجات + ماليات + إجراءات قريبة + إيصالات */
.dashboard-stats{grid-template-columns:repeat(5,1fr)}
.profit-stat{border-color:rgba(34,197,94,.35);background:linear-gradient(180deg,rgba(34,197,94,.08),var(--panel))}
.profit-mini{outline:1px solid rgba(34,197,94,.18)}
.gb-mini b{font-size:21px!important}
.line-card,.customer-list-card,.member-card{background:linear-gradient(160deg,#1b1129,#130c20);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.line-card-head,.member-head,.line-detail-hero,.line-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.line-card h3,.customer-list-card h3,.member-card h4{margin:0 0 5px}.line-card p,.customer-list-card p,.member-card p{margin:3px 0;color:var(--muted);font-size:12px;line-height:1.6}
.gb-hero{min-width:104px;border-radius:16px;padding:8px 12px;text-align:center;background:#0e0a16;border:1px solid currentColor;line-height:1}
.gb-hero small{display:block;font-size:10px;opacity:.8;margin-bottom:5px}.gb-hero strong{font-size:30px;font-weight:900}.gb-hero em{font-style:normal;font-size:12px;font-weight:800;margin-right:3px}.gb-hero.good{color:#34d399}.gb-hero.warn{color:#f59e0b}.gb-hero.bad{color:#ef4444}
.capacity-strip{display:flex;flex-wrap:wrap;gap:7px 14px;margin:11px 0 7px;font-size:12px;color:#d8cfe3}.capacity-strip span{background:#100a1b;border-radius:10px;padding:7px 9px}
.line-money-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.line-money-grid>div{background:#100a1b;border:1px solid rgba(255,255,255,.04);padding:10px;border-radius:12px;cursor:pointer}.line-money-grid span{display:block;font-size:10px;color:var(--muted)}.line-money-grid b{display:block;margin-top:5px;font-size:15px}.line-money-grid .profit-box{border-color:rgba(34,197,94,.2)}
.line-note{margin-top:10px;border-radius:11px;padding:8px 10px;background:#100a1b;font-size:12px}.line-card-actions,.member-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;border-top:1px solid rgba(255,255,255,.06);padding-top:10px}
.btn.disabled,.btn:disabled{opacity:.42;cursor:not-allowed;filter:saturate(.3)}
.member-money,.customer-quick{display:flex;flex-wrap:wrap;gap:7px 13px;margin-top:8px;font-size:12px}.member-money span,.customer-quick span{background:#100a1b;border-radius:10px;padding:7px 9px}
.line-detail-hero{align-items:center;margin-bottom:12px}.line-detail-hero h3{margin:8px 0 0}.line-section-head{align-items:center;margin:16px 0 10px}.line-section-head h3{margin:0}
.group-line-card .gb-hero{min-width:88px}.group-line-card .gb-hero strong{font-size:25px}
.receipt-wrap{display:grid;place-items:center}.receipt{width:min(390px,100%);background:#fff;color:#17121d;border-radius:22px;padding:24px 22px;box-shadow:0 18px 50px rgba(0,0,0,.35);direction:rtl}.receipt-brand{text-align:center;color:#6d28d9;font-weight:900;font-size:18px}.receipt-ok{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;margin:14px auto 8px;background:#dcfce7;color:#15803d;font-size:28px;font-weight:900}.receipt h2{text-align:center;margin:5px 0 18px;font-size:19px}.receipt-row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid #ece7f0;font-size:13px}.receipt-row span{color:#6b6470}.receipt-account{display:flex;justify-content:space-between;gap:12px;margin-top:14px;padding:11px;border-radius:12px;background:#f5f3f7}.receipt-account.good{color:#15803d}.receipt-account.bad{color:#b91c1c}.receipt-no{text-align:center;margin-top:14px;color:#7c6f80;font-size:11px}.receipt-thanks{text-align:center;margin-top:10px;font-weight:800}.receipt-hint{text-align:center;color:var(--muted);font-size:11px;margin:10px 0 0}
@media(max-width:900px){.dashboard-stats{grid-template-columns:repeat(2,1fr)}.dashboard-stats .profit-stat{grid-column:1/-1}.line-money-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.line-card-head,.line-detail-hero{align-items:center}.gb-hero{min-width:92px}.gb-hero strong{font-size:27px}.line-money-grid{grid-template-columns:1fr 1fr}.line-money-grid .profit-box{grid-column:1/-1}.line-card-actions .btn,.member-actions .btn{flex:1 1 calc(50% - 7px)}.customer-quick{display:grid;grid-template-columns:1fr 1fr}.dashboard-stats{grid-template-columns:1fr 1fr}}

/* V1.8 — إدخال ذكي وسريع */
.package-combo{display:grid;grid-template-columns:1fr 58px;gap:7px;direction:rtl}.package-combo input{font-size:20px;font-weight:800}.package-combo select{width:58px;padding:10px 4px;text-align:center;border:1px solid var(--line);background:#241638;color:#fff;border-radius:12px}
.autocomplete-field{position:relative}.suggest-box{position:absolute;z-index:12;top:68px;right:0;left:0;background:#120a1e;border:1px solid #63427f;border-radius:13px;padding:6px;box-shadow:var(--shadow);max-height:230px;overflow:auto}.suggest-row{display:flex;width:100%;justify-content:space-between;gap:10px;text-align:right;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:10px}.suggest-row:last-child{border-bottom:0}.suggest-row span{color:var(--muted);font-size:11px}.suggest-row:active{background:#211432}.mini-link{border:0;background:rgba(139,92,246,.18);color:#d8b4fe;border-radius:999px;padding:4px 8px;font-size:11px;cursor:pointer}

</script><script>
const STORAGE_KEY='manager_lines_v23_clean_20260812';
const UNDO_KEY='family_lines_new_v1_undo';
const GROUPS={WE:['WE يوم 1','WE يوم 16'],'اتصالات':['اتصالات يوم 1','اتصالات يوم 15']};
let state=null, currentPage='dashboard', customerDetailReturnPage='customers', currentCustomerId='';
const memoryStore={};
function storageGet(k){try{return localStorage.getItem(k)}catch(e){return memoryStore[k]||null}}
function storageSet(k,v){try{localStorage.setItem(k,v)}catch(e){memoryStore[k]=v}}
function storageRemove(k){try{localStorage.removeItem(k)}catch(e){delete memoryStore[k]}}

const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=(p='id')=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const parseDate=s=>s?new Date(s+'T00:00:00'):null;
const addMonths=(s,n=1)=>{const d=parseDate(s);if(!d)return s;const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d.toISOString().slice(0,10)};
const groupDay=group=>Number(String(group||'').match(/\d+/)?.[0]||1);
function nextGroupBoundary(group,fromDate=todayISO()){const base=parseDate(fromDate)||new Date();const day=groupDay(group);let d=new Date(base.getFullYear(),base.getMonth(),day);if(d<=base)d=new Date(base.getFullYear(),base.getMonth()+1,day);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
const diffDays=(a,b)=>Math.floor((parseDate(a)-parseDate(b))/86400000);
const money=n=>Number(n||0).toLocaleString('ar-EG')+'ج';
const num=n=>Number(n||0).toLocaleString('ar-EG');
const profitText=n=>Number(n||0)>0?'ربح '+money(Number(n||0)):Number(n||0)<0?'خسارة '+money(Math.abs(Number(n||0))):'تعادل '+money(0);
const profitClass=n=>Number(n||0)>=0?'good':'bad';
const phoneOk=v=>/^\d{11}$/.test(String(v||''));
const customerDisplayName=c=>String(c?.name||'').trim()||'بدون اسم';
const customerRef=c=>String(c?.name||'').trim()||String(c?.phone||'بدون اسم');
const waUrl=(p,msg='')=>phoneOk(p)?'https://wa.me/2'+String(p).slice(1)+(msg?'?text='+encodeURIComponent(msg):''):'#';
function openWhatsAppFor(p,msg=''){if(!phoneOk(p))return toast('رقم واتساب غير صحيح');window.open(waUrl(p,msg),'_blank')}
function copyTextValue(v,label='تم النسخ'){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(String(v)).then(()=>toast(label)).catch(()=>fallbackCopy(v,label))}else fallbackCopy(v,label)}
function fallbackCopy(v,label='تم النسخ'){const t=document.createElement('textarea');t.value=String(v);document.body.appendChild(t);t.select();try{document.execCommand('copy');toast(label)}catch(e){toast('انسخ الرقم يدويًا')}t.remove()}
function copyPhone(p){copyTextValue(p,'تم نسخ الرقم')}
function deepClone(o){return JSON.parse(JSON.stringify(o))}
function hashPin(s){let h=2166136261;for(const ch of String(s)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add('hidden'),2200)}
function closeModal(){$('#modalRoot').innerHTML=''}
function modal(title,body,foot=''){ $('#modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>` }

function migrate(s){
 s.schemaVersion=5;s.lines=s.lines||[];s.customers=s.customers||[];s.payments=s.payments||[];s.reservations=s.reservations||[];s.wireless=s.wireless||[];s.wirelessPayments=s.wirelessPayments||[];s.routers=s.routers||[];s.audit=s.audit||[];s.receipts=s.receipts||[];s.legacy=s.legacy||{invoices:[],archive:[]};
 s.settings=s.settings||{};s.settings.wePrices=s.settings.wePrices||{'10':180,'15':220,'20':270,'30':340,'33':380,'40':420,'50':500,'60':600,'70':680,'80':750,'100':860};
 s.settings.etisalatPrices=s.settings.etisalatPrices||{'14':275,'20':320,'30':390,'40':490,'50':580,'60':680,'70':770,'80':850};
 s.settings.wirelessPrices=s.settings.wirelessPrices||{'WE Air 90':350,'WE Air 325':750,'iHome 140':450,'iHome 225':550};
 s.settings.backupReminderDays=s.settings.backupReminderDays||7;s.settings.lastBackupAt=s.settings.lastBackupAt||'';s.settings.pinHash=s.settings.pinHash||'';s.settings.brandName=s.settings.brandName||'وحش الباقات والعروض';
 s.lines.forEach(l=>{if(l.capacityGb==null)l.capacityGb=Number(l.gb||0);if(l.maxMembers==null)l.maxMembers=l.network==='WE'?6:(Number(l.capacityGb)<=70?5:7);if(l.active==null)l.active=true});
 s.customers.forEach(c=>{if(c.nextRenewal==null)c.nextRenewal=c.renewal||'';if(c.regularity==null)c.regularity='غير محدد';if(c.source==null)c.source='غير محدد';if(c.active==null)c.active=true;if(c.renewalStatus==null)c.renewalStatus='غير محدد';if(c.lastRenewedAt==null)c.lastRenewedAt=''});
 s.wireless.forEach(w=>{if(w.active==null)w.active=true;if(w.address==null)w.address='';if(w.renewalStatus==null)w.renewalStatus='غير محدد';if(w.lastRenewedAt==null)w.lastRenewedAt='';const l=s.lines.find(x=>x.id===w.lineId);if(l){const nd=groupDay(l.group);const d=parseDate(w.nextRenewal||'');if(!w.nextRenewal||!d||d.getDate()!==nd)w.nextRenewal=nextGroupBoundary(l.group,todayISO())}});
 return s;
}
function load(){
 try{const saved=storageGet(STORAGE_KEY);state=migrate(saved?JSON.parse(saved):deepClone(window.INITIAL_DATA))}catch(e){state=migrate(deepClone(window.INITIAL_DATA))}
 ensureCycles();save(false);$('#ownerLabel').textContent=(state.owner?.name||'')+' • البيانات محفوظة على الجهاز';
 if(state.settings.pinHash){$('#lockScreen').classList.remove('hidden')}else{$('#lockScreen').classList.add('hidden')}
}
function save(render=true){storageSet(STORAGE_KEY,JSON.stringify(state));if(render)renderAll()}
function snapshot(){storageSet(UNDO_KEY,JSON.stringify(state))}
function commit(action,fn){snapshot();fn();state.audit.unshift({id:uid('a'),at:new Date().toISOString(),action});state.audit=state.audit.slice(0,250);save();toast('تم الحفظ')}
function undoLast(){const u=storageGet(UNDO_KEY);if(!u)return toast('لا توجد عملية للتراجع');if(!confirm('التراجع عن آخر عملية؟'))return;state=migrate(JSON.parse(u));storageRemove(UNDO_KEY);save();toast('تم التراجع')}

function statusOf(amount,paid){amount=Number(amount||0);paid=Number(paid||0);if(amount<=0)return'لا يوجد مبلغ';if(paid>=amount)return'مدفوع';if(paid>0)return'مدفوع جزئي';return'لسه'}
function ensureCycles(){
 const today=todayISO();let changed=false;
 for(const c of state.customers){
   if(!c.active)continue;
   const l=customerLine(c);if(!l)continue;
   if(!c.nextRenewal)c.nextRenewal=nextGroupBoundary(l.group,c.activation||today);
   while(c.nextRenewal<=today){
     const due=c.nextRenewal;
     if(!state.payments.some(p=>p.customerId===c.id&&p.dueDate===due)){
       state.payments.push({id:uid('pay'),customerId:c.id,dueDate:due,amount:Number(c.price||0),paid:0,status:'لسه',paidDate:'',notes:'دورة تجديد تلقائية'});
     }
     c.nextRenewal=nextGroupBoundary(l.group,due);c.renewal=c.nextRenewal;c.renewalStatus='لم يتم التجديد';changed=true;
   }
 }
 for(const w of state.wireless){if(!w.active)continue;const l=state.lines.find(x=>x.id===w.lineId);if(l&&!w.nextRenewal)w.nextRenewal=nextGroupBoundary(l.group,w.activation||today);if(!w.nextRenewal)continue;while(w.nextRenewal<=today){const due=w.nextRenewal;if(!state.wirelessPayments.some(p=>p.wirelessId===w.id&&p.dueDate===due)){state.wirelessPayments.push({id:uid('wpay'),wirelessId:w.id,dueDate:due,amount:Number(w.price||0),paid:0,status:'لسه',paidDate:''});changed=true}w.nextRenewal=l?nextGroupBoundary(l.group,due):addMonths(due,1);w.renewalStatus='لم يتم التجديد';changed=true}}
 return changed;
}
function currentPayment(c){const today=todayISO();return state.payments.filter(p=>p.customerId===c.id&&p.dueDate<=today).sort((a,b)=>b.dueDate.localeCompare(a.dueDate))[0]||null}
function currentWirelessPayment(w){const today=todayISO();return state.wirelessPayments.filter(p=>p.wirelessId===w.id&&p.dueDate<=today).sort((a,b)=>b.dueDate.localeCompare(a.dueDate))[0]||null}
function paymentInfo(c){const p=currentPayment(c);if(!p)return{amount:Number(c.price||0),paid:Number(c.paid||0),remaining:Math.max(0,Number(c.price||0)-Number(c.paid||0)),status:statusOf(c.price,c.paid),due:c.activation||'',days:0};const rem=Math.max(0,Number(p.amount)-Number(p.paid));return{amount:Number(p.amount),paid:Number(p.paid),remaining:rem,status:statusOf(p.amount,p.paid),due:p.dueDate,days:rem>0?Math.max(0,diffDays(todayISO(),p.dueDate)):0,p}}
function wirelessPaymentInfo(w){const p=currentWirelessPayment(w);if(!p)return{amount:Number(w.price||0),paid:Number(w.paid||0),remaining:Math.max(0,Number(w.price||0)-Number(w.paid||0)),status:statusOf(w.price,w.paid),due:w.activation||'',days:0};const rem=Math.max(0,Number(p.amount)-Number(p.paid));return{amount:Number(p.amount),paid:Number(p.paid),remaining:rem,status:statusOf(p.amount,p.paid),due:p.dueDate,days:rem>0?Math.max(0,diffDays(todayISO(),p.dueDate)):0,p}}

function lineCustomers(lineId,excludeId=''){return state.customers.filter(c=>c.active&&c.lineId===lineId&&c.id!==excludeId)}
function linkedWirelessForLine(lineId,excludeWirelessId=''){return state.wireless.find(w=>w.active!==false&&w.lineId===lineId&&w.id!==excludeWirelessId)||null}
function lineMetrics(l,excludeCustomerId=''){const cs=lineCustomers(l.id,excludeCustomerId);const allocated=cs.reduce((s,c)=>s+Number(c.gb||0),0);const cap=Number(l.capacityGb??l.gb??0);const used=cs.length,max=Number(l.maxMembers|| (l.network==='WE'?6:7));return{allocated,remaining:cap-allocated,used,max,vacancies:Math.max(0,max-used),revenue:cs.reduce((s,c)=>s+Number(c.price||0),0)}}
function lineFinancials(l){
 const cs=lineCustomers(l.id);const infos=cs.map(c=>paymentInfo(c));
 const membersDue=infos.reduce((s,i)=>s+Number(i.amount||0),0),membersCollected=infos.reduce((s,i)=>s+Number(i.paid||0),0),membersOutstanding=infos.reduce((s,i)=>s+Number(i.remaining||0),0);
 const w=linkedWirelessForLine(l.id);const wi=w?wirelessPaymentInfo(w):null;const wirelessDue=wi?Number(wi.amount||0):0,wirelessCollected=wi?Number(wi.paid||0):0,wirelessOutstanding=wi?Number(wi.remaining||0):0;
 const invoice=Number(l.cost||0),totalDue=membersDue+wirelessDue,totalCollected=membersCollected+wirelessCollected,totalOutstanding=membersOutstanding+wirelessOutstanding;
 // فاتورة الخط مصروف والتزام على النشاط، وليست دخلاً.
 const netProfit=totalDue-invoice;
 const cashPosition=totalCollected-invoice;
 const invoiceRemaining=Math.max(0,invoice-totalCollected);
 const collectedSurplus=Math.max(0,totalCollected-invoice);
 return{invoice,membersDue,membersCollected,membersOutstanding,wirelessDue,wirelessCollected,wirelessOutstanding,totalDue,totalCollected,totalOutstanding,netProfit,expectedProfit:netProfit,cashPosition,invoiceRemaining,collectedSurplus,wireless:w};
}
function groupMetrics(group){
 const ls=state.lines.filter(l=>l.active&&l.group===group),ms=ls.map(l=>({l,m:lineMetrics(l),f:lineFinancials(l)}));
 const netProfit=ms.reduce((s,x)=>s+x.f.netProfit,0),invoice=ms.reduce((s,x)=>s+x.f.invoice,0),collected=ms.reduce((s,x)=>s+x.f.totalCollected,0);
 return{lines:ls.length,remaining:ms.reduce((s,x)=>s+Math.max(0,x.m.remaining),0),linesWithGb:ms.filter(x=>x.m.remaining>0).length,linesOpen:ms.filter(x=>x.m.remaining>0&&x.m.vacancies>0).length,linesFullWithGb:ms.filter(x=>x.m.remaining>0&&x.m.vacancies===0).length,vacancies:ms.reduce((s,x)=>s+(x.m.remaining>0?x.m.vacancies:0),0),invoice,membersDue:ms.reduce((s,x)=>s+x.f.membersDue,0),collected,outstanding:ms.reduce((s,x)=>s+x.f.totalOutstanding,0),wirelessDue:ms.reduce((s,x)=>s+x.f.wirelessDue,0),wirelessCollected:ms.reduce((s,x)=>s+x.f.wirelessCollected,0),netProfit,expectedProfit:netProfit,cashPosition:collected-invoice,invoiceRemaining:Math.max(0,invoice-collected)};
}
function overallFinancials(){
 const lines=state.lines.filter(l=>l.active);const invoices=lines.reduce((s,l)=>s+Number(l.cost||0),0);
 const mobile=state.customers.filter(c=>c.active).map(paymentInfo);const wireless=state.wireless.filter(w=>w.active!==false).map(wirelessPaymentInfo);
 const totalDue=[...mobile,...wireless].reduce((s,i)=>s+Number(i.amount||0),0),collected=[...mobile,...wireless].reduce((s,i)=>s+Number(i.paid||0),0),outstanding=[...mobile,...wireless].reduce((s,i)=>s+Number(i.remaining||0),0);
 return{invoices,totalDue,collected,outstanding,netProfit:totalDue-invoices,cashPosition:collected-invoices,invoiceRemaining:Math.max(0,invoices-collected)};
}
function gbStateClass(l,m){const cap=Math.max(1,Number(l.capacityGb||0)),ratio=m.remaining/cap;if(m.remaining<=0)return'bad';if(ratio<=.15)return'warn';return'good'}
function addCustomerToLine(lineId){const l=state.lines.find(x=>x.id===lineId&&x.active);if(!l)return toast('الخط غير موجود');const m=lineMetrics(l);if(m.vacancies<=0)return toast('الأماكن مكتملة على الخط');if(m.remaining<=0)return toast('لا توجد جيجات متاحة على الخط');openCustomerModal('',{network:l.network,group:l.group,lineId:l.id});}
function openLineOutstanding(lineId){const l=state.lines.find(x=>x.id===lineId);if(!l)return;const rows=[...state.customers.filter(c=>c.active&&c.lineId===lineId).map(c=>({kind:'mobile',c,i:paymentInfo(c),l,name:customerDisplayName(c),phone:c.phone,typeLabel:'موبايل'})),...state.wireless.filter(w=>w.active!==false&&w.lineId===lineId).map(w=>({kind:'wireless',w,i:wirelessPaymentInfo(w),l,name:w.customerName,phone:w.phone,typeLabel:w.type}))].filter(x=>x.i.remaining>0).sort((a,b)=>b.i.remaining-a.i.remaining);modal('متبقي التحصيل — '+l.owner,`<div class="alert ${rows.length?'warn':'good'}">${rows.length?`عدد الحالات ${num(rows.length)} • الإجمالي ${money(rows.reduce((s,x)=>s+x.i.remaining,0))}`:'لا يوجد مبالغ متبقية على الخط'}</div><div class="collection-cards">${rows.map(x=>collectionCardHtml(x,true)).join('')}</div>`)}
function openOverallFinancials(){const f=overallFinancials(),groups=['WE يوم 1','WE يوم 16','اتصالات يوم 1','اتصالات يوم 15'];modal('الحصيلة المالية الإجمالية',`<div class="alert warn"><b>قاعدة الحساب:</b> فواتير الخطوط مصروف. صافي الربح = إجمالي المبيعات/المطلوب − فواتير الخطوط. التحصيل يوضح الفلوس التي دخلت فعليًا فقط.</div><div class="stats"><div class="stat"><div class="label">فواتير الخطوط (مصروف)</div><div class="value bad">${money(f.invoices)}</div></div><div class="stat"><div class="label">إجمالي المبيعات/المطلوب</div><div class="value">${money(f.totalDue)}</div></div><div class="stat"><div class="label">تم تحصيل فعليًا</div><div class="value good">${money(f.collected)}</div></div><div class="stat"><div class="label">باقي عند العملاء</div><div class="value bad">${money(f.outstanding)}</div></div><div class="stat"><div class="label">المتبقي لتغطية فواتير الخطوط</div><div class="value ${f.invoiceRemaining?'bad':'good'}">${money(f.invoiceRemaining)}</div></div><div class="stat profit-stat"><div class="label">صافي الربح</div><div class="value ${profitClass(f.netProfit)}">${profitText(f.netProfit)}</div></div></div><div class="cards-list" style="margin-top:12px">${groups.map(g=>{const m=groupMetrics(g);return `<div class="result-card clickable-card" onclick="closeModal();showGroupDetails('${g}')"><h4>${esc(g)}</h4><p>صافي النتيجة <b class="${profitClass(m.netProfit)}">${profitText(m.netProfit)}</b> • باقي تحصيل ${money(m.outstanding)} • لتغطية الفواتير ${money(m.invoiceRemaining)}</p><span class="open-hint">اضغط للتفاصيل ←</span></div>`}).join('')}</div>`)}

function customerLine(c){return state.lines.find(l=>l.id===c.lineId)}
function priceMap(net){return net==='WE'?state.settings.wePrices:state.settings.etisalatPrices}
function groupOptions(net,sel=''){return (GROUPS[net]||[]).map(g=>`<option value="${esc(g)}" ${g===sel?'selected':''}>${esc(g.replace(net+' ',''))}</option>`).join('')}
function packageOptions(net,sel=''){const keys=Object.keys(priceMap(net)).sort((a,b)=>Number(a)-Number(b));if(sel&&!keys.includes(String(sel)))keys.push(String(sel));return keys.map(k=>`<option value="${esc(k)}" ${String(k)===String(sel)?'selected':''}>${esc(k)} جيجا</option>`).join('')}
function lineOptions(net,group,sel='',excludeCustomerId=''){return state.lines.filter(l=>l.active&&l.network===net&&l.group===group).map(l=>{const m=lineMetrics(l,excludeCustomerId);return `<option value="${l.id}" ${l.id===sel?'selected':''}>${esc(l.owner)} • ****${esc(String(l.number).slice(-4))} • متاح ${num(Math.max(0,m.remaining))}GB • ${m.vacancies} مكان</option>`}).join('')}

function collectionSummary(){
 const mobile=state.customers.filter(c=>c.active).map(c=>({kind:'mobile',c,i:paymentInfo(c),l:customerLine(c)}));
 const wireless=state.wireless.filter(w=>w.active!==false).map(w=>({kind:'wireless',w,i:wirelessPaymentInfo(w),l:state.lines.find(x=>x.id===w.lineId)}));
 const infos=[...mobile,...wireless];
 return{unpaid:infos.filter(x=>x.i.remaining>0).length,partial:infos.filter(x=>x.i.status==='مدفوع جزئي').length,outstanding:infos.reduce((s,x)=>s+x.i.remaining,0),over3:infos.filter(x=>x.i.remaining>0&&x.i.days>3).length,paid:infos.filter(x=>x.i.status==='مدفوع').length,total:infos.length,mobileUnpaid:mobile.filter(x=>x.i.remaining>0).length,wirelessUnpaid:wireless.filter(x=>x.i.remaining>0).length};
}
function collectionItems(mode='unpaid',type='all'){
 let rows=[
  ...state.customers.filter(c=>c.active).map(c=>({kind:'mobile',c,i:paymentInfo(c),l:customerLine(c),name:customerDisplayName(c),phone:c.phone,typeLabel:'موبايل'})),
  ...state.wireless.filter(w=>w.active!==false).map(w=>({kind:'wireless',w,i:wirelessPaymentInfo(w),l:state.lines.find(x=>x.id===w.lineId),name:w.customerName,phone:w.phone,typeLabel:w.type}))
 ];
 if(type==='mobile')rows=rows.filter(x=>x.kind==='mobile');
 if(type==='WE Air')rows=rows.filter(x=>x.kind==='wireless'&&x.w.type==='WE Air');
 if(type==='iHome')rows=rows.filter(x=>x.kind==='wireless'&&x.w.type==='iHome');
 if(mode==='unpaid'||mode==='outstanding')rows=rows.filter(x=>x.i.remaining>0);
 if(mode==='partial')rows=rows.filter(x=>x.i.status==='مدفوع جزئي');
 if(mode==='over3')rows=rows.filter(x=>x.i.remaining>0&&x.i.days>3);
 if(mode==='paid')rows=rows.filter(x=>x.i.status==='مدفوع');
 return rows.sort((a,b)=>b.i.days-a.i.days||b.i.remaining-a.i.remaining);
}
function collectionItemSearchText(x){return ((x.name||'')+' '+(x.phone||'')+' '+(x.typeLabel||'')+' '+(x.l?.group||'')+' '+(x.kind==='mobile'?(x.c?.gb||''):(x.w?.packageGb||''))).toLowerCase()}
function collectionCardHtml(x,compact=false){
 const cls=x.i.remaining?(x.i.status==='مدفوع جزئي'?'warn':'bad'):'good';
 const mobileOpen=compact?`closeModal();openCustomerDetails('${x.c?.id||''}')`:`openCustomerDetails('${x.c?.id||''}')`;
 const wirelessOpen=compact?`closeModal();showWireless('${x.w?.id||''}')`:`showWireless('${x.w?.id||''}')`;
 if(x.kind==='mobile'){
  const wa=x.c.whatsapp||x.c.phone;

function openCollectionDetail(mode='unpaid',type='all'){
 const labels={unpaid:'اللي لسه مدفعوش',outstanding:'تفاصيل الفلوس اللي بره',partial:'دفع جزئي',over3:'المتأخرين أكثر من 3 أيام',paid:'المدفوعين'};const rows=collectionItems(mode,type);const total=rows.reduce((x,r)=>x+r.i.remaining,0);
 modal(labels[mode]||'تفاصيل التحصيل',`<div class="alert ${rows.length?'warn':'good'}">عدد الاشتراكات: <b>${num(rows.length)}</b>${mode!=='paid'?` • المتبقي: <b>${money(total)}</b>`:''}</div><div class="collection-filter-pills"><button class="pill interactive" onclick="closeModal();openCollectionDetail('${mode}','all')">الكل</button><button class="pill interactive" onclick="closeModal();openCollectionDetail('${mode}','mobile')">موبايل</button><button class="pill interactive" onclick="closeModal();openCollectionDetail('${mode}','WE Air')">WE Air</button><button class="pill interactive" onclick="closeModal();openCollectionDetail('${mode}','iHome')">iHome</button></div><div class="collection-cards">${rows.map(x=>collectionCardHtml(x,true)).join('')||'<div class="empty">لا توجد نتائج</div>'}</div>`);
}
function openGroupMetric(group,mode='all'){
 let ls=state.lines.filter(l=>l.active&&l.group===group);if(mode==='withGb')ls=ls.filter(l=>lineMetrics(l).remaining>0);if(mode==='open')ls=ls.filter(l=>{const m=lineMetrics(l);return m.remaining>0&&m.vacancies>0});if(mode==='fullGb')ls=ls.filter(l=>{const m=lineMetrics(l);return m.remaining>0&&m.vacancies===0});if(mode==='over')ls=ls.filter(l=>lineMetrics(l).remaining<0);if(mode==='outstanding')ls=ls.filter(l=>lineFinancials(l).totalOutstanding>0);
 const title={all:'كل الخطوط',withGb:'الخطوط اللي فيها جيجات',open:'الخطوط اللي ينفع إضافة أفراد عليها',fullGb:'جيجات زيادة لكن الأماكن كاملة',over:'خطوط متجاوزة السعة',outstanding:'خطوط عليها متبقي تحصيل'}[mode]||'تفاصيل';
 modal(`${group} — ${title}`,`<div class="cards-list">${ls.map(l=>{const m=lineMetrics(l),f=lineFinancials(l),gbc=gbStateClass(l,m);return `<div class="result-card clickable-card" onclick="closeModal();showLine('${l.id}')"><div class="line-card-head"><h4>${esc(l.owner)} • ****${esc(String(l.number).slice(-4))}</h4><div class="gb-hero ${gbc}"><small>متبقي</small><strong>${num(m.remaining)}</strong><em>GB</em></div></div><p>فاضي ${m.vacancies} مكان • فاتورة الخط ${money(f.invoice)} • باقي تحصيل ${money(f.totalOutstanding)} • ${profitText(f.netProfit)}</p><span class="open-hint">اضغط لفتح الخط كامل ←</span></div>`}).join('')||'<div class="empty">لا توجد نتائج</div>'}</div>`);
}

function attentionItems(){
 const col=collectionSummary();const arr=[];
 if(col.unpaid)arr.push({id:'unpaid',txt:`${col.unpaid} اشتراك لم يكملوا الدفع`,val:money(col.outstanding),cls:'bad'});
 const fullGb=state.lines.map(l=>({l,m:lineMetrics(l)})).filter(x=>x.m.remaining>0&&x.m.vacancies===0);const gb=fullGb.reduce((s,x)=>s+x.m.remaining,0);if(gb>0)arr.push({id:'fullGb',txt:'جيجات متاحة على خطوط أماكنها كاملة',val:num(gb)+'GB',cls:'warn'});
 const near=state.lines.map(l=>({l,m:lineMetrics(l)})).filter(x=>x.m.remaining>=0&&x.m.remaining<=Math.max(10,Number(x.l.capacityGb)*.1));if(near.length)arr.push({id:'nearLines',txt:'خطوط قربت تمتلئ أو ممتلئة',val:num(near.length)+' خط',cls:'warn'});
 const upcoming=state.customers.filter(c=>c.active&&c.nextRenewal&&diffDays(c.nextRenewal,todayISO())>=0&&diffDays(c.nextRenewal,todayISO())<=3);if(upcoming.length)arr.push({id:'upcoming',txt:'تجديدات خلال 3 أيام',val:num(upcoming.length)+' عميل',cls:'warn'});
 const last=state.settings.lastBackupAt?state.settings.lastBackupAt.slice(0,10):'';if(!last||diffDays(todayISO(),last)>=Number(state.settings.backupReminderDays||7))arr.push({id:'backup',txt:'يُنصح بتنزيل نسخة احتياطية',val:last?'آخر نسخة '+last:'لم يتم النسخ بعد',cls:'bad'});return arr
}
function openNearFullLines(){const ls=state.lines.filter(l=>l.active).map(l=>({l,m:lineMetrics(l)})).filter(x=>x.m.remaining>=0&&x.m.remaining<=Math.max(10,Number(x.l.capacityGb)*.1));modal('خطوط قربت تمتلئ أو ممتلئة',`<div class="cards-list">${ls.map(x=>`<div class="result-card clickable-card" onclick="closeModal();showLine('${x.l.id}')"><h4>${esc(x.l.owner)} • ****${esc(String(x.l.number).slice(-4))}</h4><p>${esc(x.l.group)} • متبقي ${num(x.m.remaining)}GB • أماكن فاضية ${x.m.vacancies}</p><span class="open-hint">اضغط لفتح الخط كامل ←</span></div>`).join('')||'<div class="empty">لا توجد خطوط</div>'}</div>`)}
function openUpcomingRenewals(){const cs=state.customers.filter(c=>c.active&&c.nextRenewal&&diffDays(c.nextRenewal,todayISO())>=0&&diffDays(c.nextRenewal,todayISO())<=3).sort((a,b)=>a.nextRenewal.localeCompare(b.nextRenewal));modal('تجديدات خلال 3 أيام',`<div class="cards-list">${cs.map(c=>{const l=customerLine(c),i=paymentInfo(c);return `<div class="result-card clickable-card" onclick="closeModal();openCustomerDetails('${c.id}')"><h4>${esc(customerDisplayName(c))}</h4><p>${esc(l?.group||'')} • التجديد ${esc(c.nextRenewal)} • ${i.remaining?'باقي '+money(i.remaining):'مدفوع'}</p><span class="open-hint">اضغط لفتح العميل ←</span></div>`}).join('')||'<div class="empty">لا توجد تجديدات قريبة</div>'}</div>`)}
function openBackupAttention(){modal('النسخ الاحتياطي',`<div class="info-card"><h3>💾 أمان بياناتك</h3><p class="muted">نزّل نسخة JSON كاملة الآن، أو افتح صفحة المزيد للاسترجاع والتصدير.</p><button class="btn" onclick="downloadBackup();closeModal()">تنزيل نسخة احتياطية الآن</button> <button class="btn secondary" onclick="closeModal();showPage('more')">فتح إعدادات النسخ</button></div>`)}
function handleAttention(id){if(id==='unpaid')return openCollectionDetail('unpaid');if(id==='fullGb'){const groups=['WE يوم 1','WE يوم 16','اتصالات يوم 1','اتصالات يوم 15'];const ls=state.lines.filter(l=>l.active).filter(l=>{const m=lineMetrics(l);return m.remaining>0&&m.vacancies===0});return modal('جيجات زيادة — الأماكن كاملة',`<div class="cards-list">${ls.map(l=>{const m=lineMetrics(l);return `<div class="result-card clickable-card" onclick="closeModal();showLine('${l.id}')"><h4>${esc(l.owner)} • ****${esc(String(l.number).slice(-4))}</h4><p>${esc(l.group)} • متاح ${num(m.remaining)}GB • الأماكن كاملة</p><span class="open-hint">اضغط لفتح الخط والعملاء ←</span></div>`}).join('')||'<div class="empty">لا توجد نتائج</div>'}</div>`)}if(id==='nearLines')return openNearFullLines();if(id==='upcoming')return openUpcomingRenewals();if(id==='backup')return openBackupAttention();}

function refreshLinesList(){const q=($('#lineSearch')?.value||'').trim().toLowerCase(),gf=$('#lineGroupFilter')?.value||'الكل',mode=$('#lineModeFilter')?.value||'all';let ls=state.lines.filter(l=>l.active);if(gf!=='الكل')ls=ls.filter(l=>l.group===gf);ls=ls.filter(l=>(l.owner+' '+l.number+' '+l.notes).toLowerCase().includes(q));if(mode==='open')ls=ls.filter(l=>{const m=lineMetrics(l);return m.vacancies>0&&m.remaining>0});if(mode==='extra')ls=ls.filter(l=>{const m=lineMetrics(l);return m.vacancies===0&&m.remaining>0});if(mode==='outstanding')ls=ls.filter(l=>lineFinancials(l).totalOutstanding>0);if(mode==='over')ls=ls.filter(l=>lineMetrics(l).remaining<0);const el=$('#linesList');if(!el)return;el.innerHTML=ls.length?ls.map(l=>{const m=lineMetrics(l),f=lineFinancials(l),pct=Number(l.capacityGb)>0?Math.min(100,Math.max(0,m.allocated/Number(l.capacityGb)*100)):0,gbc=gbStateClass(l,m),canAdd=m.vacancies>0&&m.remaining>0;return `<article class="line-card clickable-card" onclick="showLine('${l.id}')"><div class="line-card-head"><div><h3>${esc(l.owner)}</h3><p>${esc(l.group)} • ****${esc(String(l.number).slice(-4))}</p></div><div class="gb-hero ${gbc}"><small>متبقي</small><strong>${num(m.remaining)}</strong><em>GB</em></div></div><div class="capacity-strip"><span>السعة <b>${num(l.capacityGb)}GB</b></span><span>المباع <b>${num(m.allocated)}GB</b></span><span>الأماكن <b>${m.used}/${m.max}</b> • فاضي ${m.vacancies}</span></div><div class="progress ${m.remaining<0?'danger':''}"><i style="width:${pct}%"></i></div><div class="line-money-grid"><div onclick="event.stopPropagation();showLine('${l.id}')"><span>فاتورة الخط</span><b>${money(f.invoice)}</b></div><div onclick="event.stopPropagation();openLineOutstanding('${l.id}')"><span>باقي تحصيل</span><b class="${f.totalOutstanding?'bad':'good'}">${money(f.totalOutstanding)}</b></div><div onclick="event.stopPropagation();showLine('${l.id}')" class="profit-box"><span>صافي الربح</span><b class="${profitClass(f.netProfit)}">${profitText(f.netProfit)}</b></div></div>${m.remaining>0&&m.vacancies===0?'<div class="line-note warn">📶 فيه جيجات متاحة للبيع كإضافي لكن الأماكن مكتملة</div>':''}${m.remaining<0?'<div class="line-note bad">⚠️ الخط متجاوز السعة</div>':''}<div class="line-card-actions" onclick="event.stopPropagation()"><button class="btn secondary small" onclick="showLine('${l.id}')">فتح الخط</button><button class="btn small ${canAdd?'':'disabled'}" ${canAdd?`onclick="addCustomerToLine('${l.id}')"`:'disabled'}>${canAdd?'+ إضافة فرد':m.vacancies<=0?'الأماكن مكتملة':'لا توجد جيجات'}</button><button class="btn secondary small" onclick="openLineModal('${l.id}')">تعديل</button><button class="btn secondary small" onclick="openWirelessForLine('${l.id}')">${linkedWirelessForLine(l.id)?'فتح Air/iHome':(l.network==='WE'?'+ WE Air':'+ iHome')}</button></div></article>`}).join(''):'<div class="empty">لا توجد نتائج</div>'}

function restoreBackup(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const raw=JSON.parse(rd.result);const converted=raw.lines&&raw.customers&&!raw.schemaVersion?convertLegacy(raw):migrate(raw);const msg=`النسخة تحتوي على:\n${converted.lines.length} خط\n${converted.customers.length} عميل\n${converted.reservations.length} حجز\n${converted.wireless.length} شريحة Air/iHome\n\nسيتم استبدال البيانات الحالية. متابعة؟`;if(!confirm(msg))return;snapshot();state=converted;ensureCycles();save();toast('تم استرجاع النسخة')}catch(e){alert('ملف النسخة الاحتياطية غير صالح')}};rd.readAsText(file,'utf-8')}
function convertLegacy(raw){const x=deepClone(window.INITIAL_DATA);x.owner=raw.owner||x.owner;x.lines=(raw.lines||[]).map(l=>({...l,capacityGb:Number(l.gb||0),maxMembers:l.network==='WE'?6:(Number(l.gb)<=70?5:7),active:true}));x.customers=(raw.customers||[]).map(c=>({...c,nextRenewal:c.renewal||'',regularity:'غير محدد',source:'غير محدد',active:true}));x.reservations=raw.reservations||[];x.routers=raw.routers||[];x.legacy={invoices:raw.invoices||[],archive:raw.archive||[]};x.payments=x.customers.map(c=>({id:uid('pay'),customerId:c.id,dueDate:c.activation||todayISO(),amount:Number(c.price||0),paid:Number(c.paid||0),status:statusOf(c.price,c.paid),paidDate:'',notes:'مستورد'}));return migrate(x)}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

'الحجوزات',['الاسم','الرقم','الشبكة','الباقة','المبلغ','المدفوع','الحالة'],reservations)}</Workbook>`;downloadBlob(new Blob([xml],{type:'application/vnd.ms-excel;charset=utf-8'}),`مدير_الخطوط_${todayISO()}.xls`);toast('تم تصدير Excel')}

let quickAddSessionCount=0;
let quickAddTarget=120;
let lastOpenedLineId='';

function arToEnDigits(v){return String(v??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^0-9.]/g,'')}
function normName(v){return String(v||'').trim().replace(/\s+/g,' ').toLowerCase()}
function customerTraderKey(c){const n=String(c?.name||'').trim();if(/^تبع\s+/i.test(n))return 'name:'+normName(n);const src=String(c?.source||'').trim();if(src&&src!=='غير محدد')return 'source:'+normName(src);return''}
function customerTradeLabel(key){if(!key)return'';const [kind,...rest]=key.split(':');const val=rest.join(':');if(kind==='name'){const c=state.customers.find(x=>normName(x.name)===val);return c?.name||val}const c=state.customers.find(x=>normName(x.source)===val);return c?.source||val}
function quickPriceFor(net,gb){const k=String(Number(gb||0));return Object.prototype.hasOwnProperty.call(priceMap(net),k)?Number(priceMap(net)[k]):null}
function previousContactMatches(q){q=normName(q);if(!q)return[];const out=[],seen=new Set();for(const c of state.customers.filter(x=>x.active)){const n=normName(c.name);if(!n||!n.includes(q))continue;const contact=String(c.whatsapp||'').trim()||String(c.phone||'').trim();const key=n+'|'+contact;if(seen.has(key))continue;seen.add(key);out.push(c);if(out.length>=8)break}return out}
function previousPriceForName(name,gb,net){const q=normName(name);if(!q||!gb)return null;const rows=state.customers.filter(c=>c.active&&normName(c.name)===q&&Number(c.gb)===Number(gb)&&customerLine(c)?.network===net&&Number(c.price)>0);return rows.length?rows[rows.length-1]:null}
function customerNameChanged(){const name=$('#fCustName')?.value||'',box=$('#custNameSuggestions');if(!box)return;const matches=previousContactMatches(name);if(!matches.length){box.innerHTML='';box.classList.add('hidden');updatePreviousPriceHint();return}box.classList.remove('hidden');box.innerHTML=matches.map(c=>{const contact=c.whatsapp||c.phone;const l=customerLine(c);return `<button type="button" class="suggest-row" onclick="useCustomerSuggestion('${c.id}')"><b>${esc(customerDisplayName(c))}</b><span>${esc(contact)}${l?' • '+esc(l.network):''}${c.gb?' • '+num(c.gb)+'GB':''}</span></button>`}).join('');updatePreviousPriceHint()}
function useCustomerSuggestion(cid){const c=state.customers.find(x=>x.id===cid);if(!c)return;$('#fCustName').value=c.name||'';$('#fCustWA').value=c.whatsapp||c.phone||'';if($('#fCustSource')&&c.source&&c.source!=='غير محدد')$('#fCustSource').value=c.source;const box=$('#custNameSuggestions');if(box){box.innerHTML='';box.classList.add('hidden')}updatePreviousPriceHint();toast('تم جلب رقم التواصل السابق')}
function updatePreviousPriceHint(){const box=$('#custPrevPriceHint');if(!box)return;const name=$('#fCustName')?.value||'',gb=Number(arToEnDigits($('#fCustGb')?.value||0)),net=$('#fCustNet')?.value||'WE';const c=previousPriceForName(name,gb,net);if(!c){box.innerHTML='';return}box.innerHTML=`آخر سعر استخدمته مع <b>${esc(customerDisplayName(c))}</b> لنفس ${num(gb)}GB هو <b>${money(c.price)}</b> <button type="button" class="mini-link" onclick="$('#fCustPrice').value='${Number(c.price)}'">استخدام السعر</button>`}
function custPackageTyped(){const inp=$('#fCustGb'),price=$('#fCustPrice'),badge=$('#custAutoPrice');if(!inp||!price)return;const clean=arToEnDigits(inp.value);if(clean!==String(inp.value))inp.value=clean;const gb=Number(clean||0),net=$('#fCustNet')?.value||'WE',p=quickPriceFor(net,gb);if(p!==null){price.value=p;if(badge){badge.textContent='✓ السعر التلقائي '+money(p);badge.className='hint good'}}else if(badge){badge.textContent=gb?'لا يوجد سعر افتراضي لهذه الباقة — اكتب السعر يدويًا':'اكتب رقم الجيجات فقط، مثل 20';badge.className='hint'}custCapacityHint();updatePreviousPriceHint()}
function custQuickPackageChanged(){const s=$('#fCustQuickPackage');if(!s||!s.value)return;$('#fCustGb').value=s.value;custPackageTyped();s.value=''}
function custPhoneChanged(){const p=$('#fCustPhone'),box=$('#custPhoneAlert');if(!p||!box)return;p.value=arToEnDigits(p.value).slice(0,11);const v=p.value;if(v.length===11){const dup=state.customers.find(c=>c.active&&c.phone===v&&c.id!==(window._editingCustomerId||''));if(dup){const l=customerLine(dup);box.innerHTML=`<div class="alert bad">⚠️ الرقم مسجل بالفعل: <b>${esc(customerDisplayName(dup))}</b>${l?' • '+esc(l.group)+' • ****'+esc(String(l.number).slice(-4)):''} <button type="button" class="mini-link" onclick="closeModal();openCustomerDetails('${dup.id}')">فتح العميل</button></div>`}else{box.innerHTML='<div class="alert good">✓ الرقم صحيح وغير مكرر</div>';if(!window._editingCustomerId)setTimeout(()=>$('#fCustGb')?.focus(),80)}}else box.innerHTML=''}

function openCustomerModal(id='',prefill=null){
 window._editingCustomerId=id||'';

function bulkValidation(){const nums=bulkParseNumbers(),lid=$('#bulkLine')?.value,l=state.lines.find(x=>x.id===lid),gb=Number(arToEnDigits($('#bulkGb')?.value||0)),m=l?lineMetrics(l):null;const seen=new Set(),rows=[];let slots=m?.vacancies||0,capacity=m?.remaining||0;for(const p of nums){let err='';if(!phoneOk(p))err='الرقم لازم 11 رقم';else if(seen.has(p))err='مكرر داخل القائمة';else if(state.customers.some(c=>c.active&&c.phone===p))err='مسجل بالفعل';else if(slots<=0)err='لا توجد أماكن كافية';else if(gb<=0)err='اكتب الباقة';else if(capacity<gb)err='لا توجد جيجات كافية';if(!err){seen.add(p);slots--;capacity-=gb}else seen.add(p);rows.push({p,err})}return{rows,l,gb,valid:rows.filter(x=>!x.err),errors:rows.filter(x=>x.err)}}

function lineMetrics(l,excludeCustomerId=''){
 const cs=lineCustomers(l.id,excludeCustomerId);
 const allocated=cs.reduce((s,c)=>s+Number(c.gb||0),0);
 const baseCap=Number(l.capacityGb??l.gb??0);
 const carry=(l.network==='WE')?Number(l.carryGb||0):0;
 const effectiveCapacity=baseCap+carry;
 const used=cs.length,max=Number(l.maxMembers||(l.network==='WE'?6:7));
 return{allocated,baseCap,carry,effectiveCapacity,remaining:effectiveCapacity-allocated,used,max,vacancies:Math.max(0,max-used),revenue:cs.reduce((s,c)=>s+Number(c.price||0),0)}
}
function groupMetrics(group){
 const ls=state.lines.filter(l=>l.active&&l.group===group),ms=ls.map(l=>({l,m:lineMetrics(l),f:lineFinancials(l)}));
 const netProfit=ms.reduce((s,x)=>s+x.f.netProfit,0),invoice=ms.reduce((s,x)=>s+x.f.invoice,0),collected=ms.reduce((s,x)=>s+x.f.totalCollected,0);
 return{
  lines:ls.length,membersUsed:ms.reduce((s,x)=>s+x.m.used,0),memberSlots:ms.reduce((s,x)=>s+x.m.max,0),
  remaining:ms.reduce((s,x)=>s+Math.max(0,x.m.remaining),0),linesWithGb:ms.filter(x=>x.m.remaining>0).length,
  linesOpen:ms.filter(x=>x.m.remaining>0&&x.m.vacancies>0).length,linesFullWithGb:ms.filter(x=>x.m.remaining>0&&x.m.vacancies===0).length,
  vacancies:ms.reduce((s,x)=>s+x.m.vacancies,0),linkedWireless:ms.filter(x=>!!x.f.wireless).length,carryTotal:ms.reduce((s,x)=>s+Number(x.m.carry||0),0),
  invoice,membersDue:ms.reduce((s,x)=>s+x.f.membersDue,0),collected,outstanding:ms.reduce((s,x)=>s+x.f.totalOutstanding,0),
  wirelessDue:ms.reduce((s,x)=>s+x.f.wirelessDue,0),wirelessCollected:ms.reduce((s,x)=>s+x.f.wirelessCollected,0),
  netProfit,expectedProfit:netProfit,cashPosition:collected-invoice,invoiceRemaining:Math.max(0,invoice-collected)
 };
}

 if(currentPage&&currentPage!==page){state.settings.uiContext=state.settings.uiContext||{};state.settings.uiContext[currentPage]={scrollY:window.scrollY,lineGroup:$('#lineGroupFilter')?.value||'',lineMode:$('#lineModeFilter')?.value||'',custGroup:$('#custGroupFilter')?.value||'',custTrade:$('#custTradeFilter')?.value||''}}
 currentPage=page;$$('.page').forEach(p=>p.classList.remove('active'));$('#page-'+page)?.classList.add('active');$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(rer){if(page==='dashboard')renderDashboard();if(page==='lines')renderLines();if(page==='customers')renderCustomers();if(page==='collections')renderCollections();if(page==='wireless')renderWireless();if(page==='more')renderMore()}
 const ctx=state.settings.uiContext?.[page];setTimeout(()=>{if(ctx){if($('#lineGroupFilter')&&ctx.lineGroup)$('#lineGroupFilter').value=ctx.lineGroup;if($('#lineModeFilter')&&ctx.lineMode)$('#lineModeFilter').value=ctx.lineMode;if(page==='lines'&&$('#linesList'))refreshLinesList();if($('#custGroupFilter')&&ctx.custGroup)$('#custGroupFilter').value=ctx.custGroup;if($('#custTradeFilter')&&ctx.custTrade)$('#custTradeFilter').value=ctx.custTrade;if(page==='customers'&&$('#customersList'))refreshCustomersList();window.scrollTo(0,ctx.scrollY||0)}},10)

load();renderAll();

<script>
/* FAMILY_LINES_PATCH_V21 — إصلاح التسعير والتجديد وتثبيت الدوال */
(function(){
  'use strict';
  const PATCH_VERSION='2.1';

  function cloneObj(o){return JSON.parse(JSON.stringify(o||{}))}
  function typeLabel(t){return t==='dealer'?'تاجر':'عميل'}
  function inferType(c){
    if(c && (c.customerType==='dealer'||c.customerType==='customer')) return c.customerType;
    return /^تبع\s+/i.test(String(c?.name||'').trim())?'dealer':'customer';
  }
  function ensurePricingV21(){
    if(!state||!state.settings)return;
    const oldWE=cloneObj(state.settings.wePrices),oldET=cloneObj(state.settings.etisalatPrices);
    if(!state.settings.customerPrices) state.settings.customerPrices={WE:cloneObj(oldWE),'اتصالات':cloneObj(oldET)};
    if(!state.settings.customerPrices.WE)state.settings.customerPrices.WE=cloneObj(oldWE);
    if(!state.settings.customerPrices['اتصالات'])state.settings.customerPrices['اتصالات']=cloneObj(oldET);
    if(!state.settings.dealerPrices) state.settings.dealerPrices={WE:cloneObj(state.settings.customerPrices.WE),'اتصالات':cloneObj(state.settings.customerPrices['اتصالات'])};
    if(!state.settings.dealerPrices.WE)state.settings.dealerPrices.WE=cloneObj(state.settings.customerPrices.WE);
    if(!state.settings.dealerPrices['اتصالات'])state.settings.dealerPrices['اتصالات']=cloneObj(state.settings.customerPrices['اتصالات']);
    (state.customers||[]).forEach(c=>{if(!c.customerType)c.customerType=inferType(c)});
    state.settings.wePrices=cloneObj(state.settings.customerPrices.WE);
    state.settings.etisalatPrices=cloneObj(state.settings.customerPrices['اتصالات']);
    state.settings.appPatchVersion=PATCH_VERSION;
    state.schemaVersion=Math.max(Number(state.schemaVersion||1),2);
    storageSet(STORAGE_KEY,JSON.stringify(state));
  }

  function priceMapV21(net,type='customer'){
    ensurePricingV21();
    const bucket=type==='dealer'?state.settings.dealerPrices:state.settings.customerPrices;
    return bucket?.[net]||{};
  }
  function quickPriceV21(net,gb,type='customer'){
    const m=priceMapV21(net,type),k=String(Number(gb||0));
    return Object.prototype.hasOwnProperty.call(m,k)?Number(m[k]):null;
  }

  /* السعر الافتراضي القديم يظل سعر العميل العادي للتوافق مع الحجوزات وباقي الشاشات */
  priceMap=function(net){return priceMapV21(net,'customer')};
  quickPriceFor=function(net,gb){
    const t=document.querySelector('#fCustType')?.value||document.querySelector('#bulkCustType')?.value||document.querySelector('#qsCustType')?.value||'customer';
    return quickPriceV21(net,gb,t);
  };

  /* إصلاح إنشاء الدورات: سجل مالي جديد بدون مسح حقول الدفع التاريخية للعميل */
  ensureCycles=function(){
    const today=todayISO();let changed=false;
    for(const c of state.customers||[]){
      if(!c.active)continue;
      const l=customerLine(c);if(!l)continue;
      if(!c.nextRenewal)c.nextRenewal=nextGroupBoundary(l.group,c.activation||today);
      let guard=0;
      while(c.nextRenewal<=today && guard++<36){
        const due=c.nextRenewal;
        if(!state.payments.some(p=>p.customerId===c.id&&p.dueDate===due)){
          state.payments.push({id:uid('pay'),customerId:c.id,dueDate:due,amount:Number(c.price||0),paid:0,status:'لسه',paidDate:'',notes:'دورة تجديد تلقائية'});
          changed=true;
        }
        c.nextRenewal=nextGroupBoundary(l.group,due);
        c.renewal=c.nextRenewal;
        c.renewalStatus='لم يتم التجديد';
        changed=true;
      }
    }
    for(const w of state.wireless||[]){
      if(w.active===false)continue;
      const l=state.lines.find(x=>x.id===w.lineId);if(!l)continue;
      if(!w.nextRenewal)w.nextRenewal=nextGroupBoundary(l.group,w.activation||today);
      let guard=0;
      while(w.nextRenewal<=today && guard++<36){
        const due=w.nextRenewal;
        if(!state.wirelessPayments.some(p=>p.wirelessId===w.id&&p.dueDate===due)){
          state.wirelessPayments.push({id:uid('wpay'),wirelessId:w.id,dueDate:due,amount:Number(w.price||0),paid:0,status:'لسه',paidDate:''});
          changed=true;
        }
        w.nextRenewal=nextGroupBoundary(l.group,due);
        w.renewalStatus='لم يتم التجديد';
        changed=true;
      }
    }
    return changed;
  };

  /* إدخال العميل: إضافة اختيار عميل/تاجر مع إبقاء السعر الفعلي المسجل كما هو */
  const openCustomerModalV20=openCustomerModal;
  function addTypeField(id='',prefill={}){
    if(document.querySelector('#fCustType'))return;
    const priceInput=document.querySelector('#fCustPrice');
    if(!priceInput)return;
    const c=id?state.customers.find(x=>x.id===id):null;
    const inferred=c?inferType(c):(prefill.customerType||(/^تبع\s+/i.test(String(prefill.name||''))?'dealer':'customer'));
    const wrap=document.createElement('div');wrap.className='field';
    wrap.innerHTML='<label>نوع السعر</label><select id="fCustType"><option value="customer">عميل عادي</option><option value="dealer">تاجر / مصدر</option></select><span class="hint">اختيار النوع يحدد السعر التلقائي فقط، ويمكن تعديل السعر يدويًا.</span>';
    priceInput.closest('.field')?.before(wrap);
    document.querySelector('#fCustType').value=inferred;
    document.querySelector('#fCustType').addEventListener('change',()=>custPackageTyped());
    if(c){
      priceInput.value=Number(c.price||0);
      const badge=document.querySelector('#custAutoPrice');
      if(badge){badge.textContent='السعر المسجل: '+money(c.price)+' • '+typeLabel(inferred);badge.className='hint good'}
    }else{
      custPackageTyped();
    }
  }
  openCustomerModal=function(id='',prefill={}){
    const r=openCustomerModalV20.apply(this,arguments);
    setTimeout(()=>addTypeField(id,prefill||{}),35);
    return r;
  };

  custPackageTyped=function(){
    const inp=document.querySelector('#fCustGb'),price=document.querySelector('#fCustPrice'),badge=document.querySelector('#custAutoPrice');
    if(!inp||!price)return;
    const clean=arToEnDigits(inp.value);if(clean!==String(inp.value))inp.value=clean;
    const gb=Number(clean||0),net=document.querySelector('#fCustNet')?.value||'WE',type=document.querySelector('#fCustType')?.value||'customer',p=quickPriceV21(net,gb,type);
    if(p!==null){
      price.value=p;
      if(badge){badge.textContent='✓ سعر '+typeLabel(type)+' التلقائي '+money(p);badge.className='hint good'}
    }else if(badge){
      badge.textContent=gb?'لا يوجد سعر افتراضي لهذه الباقة — اكتب السعر يدويًا':'اكتب رقم الجيجات فقط، مثل 20';
      badge.className='hint';
    }
    if(typeof custCapacityHint==='function')custCapacityHint();
    if(typeof updatePreviousPriceHint==='function')updatePreviousPriceHint();
  };

  const saveCustomerV20=saveCustomer;
  saveCustomer=function(id='',after='close'){
    const type=document.querySelector('#fCustType')?.value||'customer';
    const phone=String(document.querySelector('#fCustPhone')?.value||'').trim();
    const beforeIds=new Set((state.customers||[]).map(c=>c.id));
    const r=saveCustomerV20.apply(this,arguments);
    let c=id?state.customers.find(x=>x.id===id):state.customers.find(x=>x.active&&x.phone===phone&&!beforeIds.has(x.id));
    if(!c && !id)c=[...(state.customers||[])].reverse().find(x=>x.active&&x.phone===phone);
    if(c){
      c.customerType=type;
      storageSet(STORAGE_KEY,JSON.stringify(state));
      if(typeof renderAll==='function')renderAll();
    }
    return r;
  };

  /* الإضافة السريعة تدعم عميل/تاجر أيضًا */
  if(typeof openQuickSingleAdd==='function'){
    const openQuickSingleAddV20=openQuickSingleAdd;
    openQuickSingleAdd=function(){
      const r=openQuickSingleAddV20.apply(this,arguments);
      setTimeout(()=>{
        if(document.querySelector('#qsCustType'))return;
        const price=document.querySelector('#qsPrice');if(!price)return;
        const f=document.createElement('div');f.className='field';
        f.innerHTML='<label>نوع السعر</label><select id="qsCustType"><option value="customer">عميل عادي</option><option value="dealer">تاجر / مصدر</option></select>';
        price.closest('.field')?.before(f);
        document.querySelector('#qsCustType').addEventListener('change',()=>{if(typeof quickSinglePackageTyped==='function')quickSinglePackageTyped()});
        if(typeof quickSinglePackageTyped==='function')quickSinglePackageTyped();
      },35);
      return r;
    };
  }
  if(typeof quickSinglePackageTyped==='function'){
    quickSinglePackageTyped=function(){
      const lid=document.querySelector('#qsLine')?.value||
        (typeof _quickLineV2Id!=='undefined'?_quickLineV2Id:'')||
        (typeof lastOpenedLineId!=='undefined'?lastOpenedLineId:'')||
        state.settings?.lastCustomerLineId||'';
      const l=state.lines.find(x=>x.id===lid),gb=Number(arToEnDigits(document.querySelector('#qsGb')?.value||0));
      const type=document.querySelector('#qsCustType')?.value||'customer',p=l?quickPriceV21(l.network,gb,type):null;
      if(p!==null&&document.querySelector('#qsPrice'))document.querySelector('#qsPrice').value=p;
      const h=document.querySelector('#qsHint');
      if(h)h.textContent=p!==null?'سعر '+typeLabel(type)+' التلقائي '+money(p):(gb?'اكتب السعر يدويًا':'اكتب رقم الجيجات فقط');
    };
  }
  function tagNewestQuickCustomer(type,phone,before){
    let c=(state.customers||[]).find(x=>x.active&&x.phone===phone&&!before.has(x.id));
    if(!c)c=[...(state.customers||[])].reverse().find(x=>x.active&&x.phone===phone);
    if(c){c.customerType=type;storageSet(STORAGE_KEY,JSON.stringify(state));if(typeof renderAll==='function')renderAll()}
  }
  if(typeof saveQuickSingleV2==='function'){
    const saveQuickSingleV2Base=saveQuickSingleV2;
    saveQuickSingleV2=function(){
      const type=document.querySelector('#qsCustType')?.value||'customer';
      const phone=arToEnDigits(document.querySelector('#qsPhone')?.value||'');
      const before=new Set((state.customers||[]).map(c=>c.id));
      const r=saveQuickSingleV2Base.apply(this,arguments);
      tagNewestQuickCustomer(type,phone,before);return r;
    };
  }
  if(typeof saveQuickSingle==='function'){
    const saveQuickSingleBase=saveQuickSingle;
    saveQuickSingle=function(){
      const type=document.querySelector('#qsCustType')?.value||'customer';
      const phone=arToEnDigits(document.querySelector('#qsPhone')?.value||'');
      const before=new Set((state.customers||[]).map(c=>c.id));
      const r=saveQuickSingleBase.apply(this,arguments);
      tagNewestQuickCustomer(type,phone,before);return r;
    };
  }

  /* الإدخال الجماعي يدعم نفس نوع السعر */
  if(typeof openBulkAdd==='function'){
    const openBulkAddV20=openBulkAdd;
    openBulkAdd=function(){
      const r=openBulkAddV20.apply(this,arguments);
      setTimeout(()=>{
        if(document.querySelector('#bulkCustType'))return;
        const price=document.querySelector('#bulkPrice');if(!price)return;
        const f=document.createElement('div');f.className='field';
        f.innerHTML='<label>نوع السعر</label><select id="bulkCustType"><option value="customer">عميل عادي</option><option value="dealer">تاجر / مصدر</option></select>';
        price.closest('.field')?.before(f);
        document.querySelector('#bulkCustType').addEventListener('change',()=>{
          if(typeof bulkPackageTyped==='function')bulkPackageTyped();
        });
      },35);
      return r;
    };
  }
  if(typeof saveBulkAdd==='function'){
    const saveBulkAddV20=saveBulkAdd;
    saveBulkAdd=function(){
      const type=document.querySelector('#bulkCustType')?.value||'customer';
      const before=new Set((state.customers||[]).map(c=>c.id));
      const r=saveBulkAddV20.apply(this,arguments);
      let touched=false;
      (state.customers||[]).forEach(c=>{if(!before.has(c.id)){c.customerType=type;touched=true}});
      if(touched){storageSet(STORAGE_KEY,JSON.stringify(state));if(typeof renderAll==='function')renderAll()}
      return r;
    };
  }

  /* شاشة أسعار موحدة: عميل + تاجر */
  window.openPrices=function(){
    ensurePricingV21();
    const grid=(title,type,net,map)=>'<h4 style="margin-top:18px">'+title+'</h4><div class="price-grid">'+
      Object.entries(map).sort((a,b)=>Number(a[0])-Number(b[0])).map(([gb,p])=>
        '<div class="field"><label>'+gb+'GB</label><input class="v21PriceInput" data-type="'+type+'" data-net="'+net+'" data-gb="'+gb+'" type="number" min="0" value="'+Number(p||0)+'"></div>'
      ).join('')+'</div>';
    const wireless='<h4 style="margin-top:18px">Air / iHome</h4><div class="price-grid">'+
      Object.entries(state.settings.wirelessPrices||{}).map(([k,p])=>
        '<div class="field"><label>'+esc(k)+'</label><input class="wirePriceInput" data-name="'+esc(k)+'" type="number" min="0" value="'+Number(p||0)+'"></div>'
      ).join('')+'</div>';
    const body='<div class="alert good"><b>V2.1:</b> أسعار العميل والتاجر أصبحت منفصلة. تغيير السعر هنا يؤثر على السعر التلقائي للعملاء الجدد فقط، ولا يغيّر أسعار العملاء المسجلين.</div>'+
      grid('💜 أسعار العميل — WE','customer','WE',state.settings.customerPrices.WE)+
      grid('💚 أسعار العميل — اتصالات','customer','اتصالات',state.settings.customerPrices['اتصالات'])+
      grid('🟣 أسعار التاجر — WE','dealer','WE',state.settings.dealerPrices.WE)+
      grid('🟢 أسعار التاجر — اتصالات','dealer','اتصالات',state.settings.dealerPrices['اتصالات'])+wireless;
    modal('الأسعار — عميل / تاجر',body,'<button class="btn" onclick="savePrices()">حفظ الأسعار</button>');
  };
  window.savePrices=function(){
    commit('تعديل أسعار العميل والتاجر',()=>{
      document.querySelectorAll('.v21PriceInput').forEach(i=>{
        const bucket=i.dataset.type==='dealer'?state.settings.dealerPrices:state.settings.customerPrices;
        bucket[i.dataset.net][i.dataset.gb]=Number(i.value||0);
      });
      document.querySelectorAll('.wirePriceInput').forEach(i=>state.settings.wirelessPrices[i.dataset.name]=Number(i.value||0));
      state.settings.wePrices=cloneObj(state.settings.customerPrices.WE);
      state.settings.etisalatPrices=cloneObj(state.settings.customerPrices['اتصالات']);
    });
    closeModal();
  };

  /* إظهار نوع السعر في صفحة العميل */
  if(typeof renderCustomerDetail==='function'){
    const renderCustomerDetailV20=renderCustomerDetail;
    renderCustomerDetail=function(){
      const r=renderCustomerDetailV20.apply(this,arguments);
      const c=state.customers.find(x=>x.id===currentCustomerId&&x.active);
      const title=document.querySelector('#page-customer-detail .detail-top h2');
      if(c&&title&&!document.querySelector('#v21TypeBadge')){
        const b=document.createElement('span');b.id='v21TypeBadge';b.className='pill';b.style.marginRight='8px';
        b.textContent=typeLabel(inferType(c));title.after(b);
      }
      return r;
    };
  }

  ensurePricingV21();
  /* بعد تثبيت الإصلاح، شغّل فحص الدورات بالدالة الجديدة ثم احفظ */
  ensureCycles();
  storageSet(STORAGE_KEY,JSON.stringify(state));
  if(typeof renderAll==='function')renderAll();
  console.info('Family Lines V2.1 patch active');
})();
</script>

<script>
/* FAMILY_LINES_PATCH_V22 */
(function(){
'use strict';

const cloneV22=o=>JSON.parse(JSON.stringify(o||{}));
const typeLabelV22=t=>t==='dealer'?'تاجر / مصدر':'عميل عادي';

function ensureV22(){
  state.settings=state.settings||{};
  const oldWE=cloneV22(state.settings.wePrices||{});
  const oldET=cloneV22(state.settings.etisalatPrices||{});

  state.settings.customerPrices=state.settings.customerPrices||{
    WE:cloneV22(oldWE),'اتصالات':cloneV22(oldET)
  };
  state.settings.customerPrices.WE=state.settings.customerPrices.WE||cloneV22(oldWE);
  state.settings.customerPrices['اتصالات']=state.settings.customerPrices['اتصالات']||cloneV22(oldET);

  state.settings.dealerPrices=state.settings.dealerPrices||{
    WE:cloneV22(state.settings.customerPrices.WE),
    'اتصالات':cloneV22(state.settings.customerPrices['اتصالات'])
  };
  state.settings.dealerPrices.WE=state.settings.dealerPrices.WE||cloneV22(state.settings.customerPrices.WE);
  state.settings.dealerPrices['اتصالات']=state.settings.dealerPrices['اتصالات']||cloneV22(state.settings.customerPrices['اتصالات']);

  /* إصلاح أي بيانات قديمة موجودة في localStorage وليس فقط INITIAL_DATA. */
  for(const l of state.lines||[]){
    if(l.network==='WE'){
      const stored=Number(l.capacityGb??l.gb??0);
      const baseOld=l.baseCapacityGb==null?null:Number(l.baseCapacityGb||0);
      if(l.carryGb==null){
        if(baseOld!==null && stored>=baseOld){
          l.carryGb=Math.max(0,stored-baseOld);
          l.capacityGb=baseOld;
          l.gb=baseOld;
        }else{
          l.carryGb=0;
          l.capacityGb=stored;
          l.gb=stored;
        }
      }
      if(l.baseCapacityGb==null)l.baseCapacityGb=Number(l.capacityGb||0);
    }
  }

  for(const c of state.customers||[]){
    const nm=String(c.name||''),pk=String(c.package||'');
    if(nm.includes('تبع')||pk.includes('تجاري'))c.customerType='dealer';
    else if(c.customerType!=='dealer'&&c.customerType!=='customer')c.customerType='customer';

    const l=state.lines.find(x=>x.id===c.lineId);
    const d=parseDate(c.nextRenewal||c.renewal||'');
    if(l&&d&&d.getDate()!==groupDay(l.group)){
      const fixed=nextGroupBoundary(l.group,todayISO());
      c.nextRenewal=fixed;c.renewal=fixed;
    }
  }

  state.settings.wePrices=cloneV22(state.settings.customerPrices.WE);
  state.settings.etisalatPrices=cloneV22(state.settings.customerPrices['اتصالات']);
  state.settings.appPatchVersion='2.2';
  state.schemaVersion=Math.max(5,Number(state.schemaVersion||0));
  storageSet(STORAGE_KEY,JSON.stringify(state));
}

function priceMapV22(net,type='customer'){
  ensureV22();
  const bucket=type==='dealer'?state.settings.dealerPrices:state.settings.customerPrices;
  return bucket?.[net]||{};
}
function quickPriceV22(net,gb,type='customer'){
  const map=priceMapV22(net,type),key=String(Number(gb||0));
  return Object.prototype.hasOwnProperty.call(map,key)?Number(map[key]):null;
}

/* الإضافة الجماعية: نوع السعر مستقل لكل فرد. */
initBulkRows=function(){
  _bulkRows=[{
    id:uid('br'),phone:'',contact:'',name:'',
    customerType:'customer',gb:'',price:'',paid:'0'
  }];
};

addBulkPerson=function(pref={}){
  _bulkRows.push({
    id:uid('br'),phone:'',contact:'',name:'',
    customerType:'customer',gb:'',price:'',paid:'0',...pref
  });
  renderBulkRows();
};

bulkRowChanged=function(id,field,value){
  const r=_bulkRows.find(x=>x.id===id);if(!r)return;
  if(['phone','contact','gb'].includes(field))value=arToEnDigits(value);
  r[field]=value;

  if(field==='gb'||field==='customerType'){
    const l=state.lines.find(x=>x.id===$('#bulkLineV2')?.value);
    const p=l?quickPriceV22(l.network,Number(r.gb||0),r.customerType||'customer'):null;
    if(p!==null)r.price=String(p);
  }

  if(field==='customerType'){
    const pi=document.querySelector(`#bulkrow_${id} input[data-bulk-price="1"]`);
    if(pi)pi.value=r.price;
  }
  renderBulkSummary();
};

renderBulkRows=function(){
  const box=$('#bulkRowsV2');if(!box)return;
  const l=state.lines.find(x=>x.id===$('#bulkLineV2')?.value);

  box.innerHTML=_bulkRows.map((r,i)=>`
    <div class="bulk-row-card" id="bulkrow_${r.id}">
      <div class="bulk-row-head">
        <b>فرد ${i+1}</b>
        <button class="bulk-remove" type="button" onclick="removeBulkPerson('${r.id}')">✕</button>
      </div>
      <div class="bulk-fields">
        <div class="field">
          <label>رقم العميل</label>
          <input maxlength="11" inputmode="numeric" value="${esc(r.phone)}"
                 oninput="bulkRowChanged('${r.id}','phone',this.value)">
        </div>
        <div class="field">
          <label>رقم التواصل</label>
          <input maxlength="11" inputmode="numeric" value="${esc(r.contact)}"

validateBulkRowsV2=function(){

  const seen=new Set();
  let slots=m?.vacancies||0,cap=m?.remaining||0;
  const rows=[];

  for(const r of _bulkRows){
    const phone=arToEnDigits(r.phone||'');
    const contact=arToEnDigits(r.contact||'');
    const gb=Number(arToEnDigits(r.gb||0));
    const price=Number(r.price||0);
    const paid=Number(r.paid||0);
    const customerType=r.customerType==='dealer'?'dealer':'customer';

    let err='';
    if(!phoneOk(phone))err='رقم العميل لازم 11 رقم';
    else if(contact&&!phoneOk(contact))err='رقم التواصل غير صحيح';
    else if(seen.has(phone))err='الرقم مكرر داخل الإدخال';
    else if(state.customers.some(c=>c.active&&c.phone===phone))err='الرقم مسجل بالفعل';
